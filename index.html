<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FLOW // Next-Gen Command Center</title>

  <!-- Tailwind CSS via CDN -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {

            sans: ['"Plus Jakarta Sans"', 'sans-serif'],

          keyframes: {
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.03)' }

          }
        }
      }
    }
  </script>
  
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <style>
    :root {
      --bg-base: #070709;
      --bg-surface: rgba(18, 18, 26, 0.7);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(255, 255, 255, 0.18);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
    }
    
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    /* Ambient Tech Grid */
    .bg-grid-cyber {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      mask-image: radial-gradient(circle at 50% 45%, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at 50% 45%, black 40%, transparent 85%);

    .glass {
      background: var(--bg-surface);

    /* Custom range slider styling */

      -webkit-appearance: none;
      height: 6px;

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;

      transition: transform 0.1s;

<body class="selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- STORAGE & DB HELPERS ---
    const storage = {
      get: (k, d) => { try { const i = window.localStorage.getItem(k); return i ? JSON.parse(i) : d; } catch (e) { return d; } },
      set: (k, v) => { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    };

    const idb = {
      db: null,
      async init() {
        if (this.db) return this.db;
        return new Promise((res, rej) => {
          const req = indexedDB.open('flow_tracks_vault', 1);
          req.onupgradeneeded = e => e.target.result.createObjectStore('tracks', { keyPath: 'id' });
          req.onsuccess = e => { this.db = e.target.result; res(this.db); };
          req.onerror = () => rej();
        });
      },
      async saveTrack(t) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').put(t);
          tx.oncomplete = () => res();
        });
      },
      async getAllTracks() {
        try {
          const db = await this.init();
          return new Promise(res => {
            const tx = db.transaction('tracks', 'readonly');
            const r = tx.objectStore('tracks').getAll();
            r.onsuccess = () => res(r.result || []);
          });
        } catch(e) { return []; }
      },
      async deleteTrack(id) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').delete(id);
          tx.oncomplete = () => res();
        });
      }
    };

    // --- AUDIO & AMBIENCE ENGINE ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.nodes = {};
      }
      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
      }
      playTone(type = 'chime') {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (type === 'digital') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'bell') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(784, now); // G5
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
          osc.start(now);
          osc.stop(now + 1.8);
        } else {
          // Zen gentle chime
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.start(now);
          osc.stop(now + 1.2);
        }
      }
      startAmbience(type, volume = 0.5) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.nodes[type]) {
          this.setAmbienceVolume(type, volume);
          return;
        }

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(volume, this.ctx.currentTime);
        g.connect(this.masterGain);

        if (type === 'brown') {
          const bufferSize = 2 * this.ctx.sampleRate;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.02 * white) / 1.02;
            lastOut = data[i];
            data[i] *= 3.2;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;
          src.connect(g);
          src.start();
          this.nodes.brown = { src, gain: g };
        } else if (type === 'rain') {
          const bufferSize = 2 * this.ctx.sampleRate;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1200;
          filter.Q.value = 0.8;
          src.connect(filter).connect(g);
          src.start();
          this.nodes.rain = { src, gain: g, filter };
        } else if (type === 'hum') {
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = 60;
          osc.connect(g);
          osc.start();
          this.nodes.hum = { src: osc, gain: g };
        } else if (type === 'binaural') {
          const oscL = this.ctx.createOscillator();
          const oscR = this.ctx.createOscillator();
          oscL.type = 'sine'; oscL.frequency.value = 210;
          oscR.type = 'sine'; oscR.frequency.value = 224; // 14Hz Beta/Flow
          const merger = this.ctx.createChannelMerger(2);
          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(g);
          oscL.start(); oscR.start();
          this.nodes.binaural = { src: [oscL, oscR], gain: g };
        }
      }
      setAmbienceVolume(type, vol) {
        if (this.nodes[type] && this.ctx) {
          this.nodes[type].gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.05);
        }
      }
      stopAmbience(type) {
        if (this.nodes[type]) {
          try {
            if (Array.isArray(this.nodes[type].src)) {
              this.nodes[type].src.forEach(s => s.stop());
            } else {
              this.nodes[type].src.stop();
            }
          } catch(e) {}
          delete this.nodes[type];
        }
      }
    }
    const soundEngine = new SoundEngine();

    // --- NOTIFICATION & WAKE LOCK SERVICES ---
    const notifier = {
      async request() {
        if ('Notification' in window && Notification.permission !== 'granted') {
          await Notification.requestPermission();
        }
      },
      dispatch(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body,
              icon: 'https://cdn-icons-png.flaticon.com/512/850/850960.png'
            });
          } catch(e) {}
        }
        if ('vibrate' in navigator) {
          navigator.vibrate([200, 100, 200, 100, 300]);
        }
      }
    };

    // Keep screen awake during sessions
    let wakeLockSentinel = null;
    const wakeLock = {
      async request() {
        try {
          if ('wakeLock' in navigator) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
          }
        } catch(e) {}
      },
      release() {
        if (wakeLockSentinel) {
          wakeLockSentinel.release().catch(()=>{});
          wakeLockSentinel = null;
        }
      }
    };

    // --- CUSTOM HOOKS ---
    function useTimer() {
      const [settings, setSettings] = useState(() => storage.get('flow_settings_v2', {
        pomodoroFocus: 25,
        pomodoroShort: 5,
        pomodoroLong: 15,
        autoStart: true,
        chimeSound: 'bell',
        accentColor: '#3b82f6',
        preset: '25/5'
      }));
      useEffect(() => { storage.set('flow_settings_v2', settings); }, [settings]);

      const [stats, setStats] = useState(() => storage.get('flow_stats_v2', {
        history: {},
        todayMinutes: 0,
        streak: 1,
        lastActiveDate: new Date().toDateString(),
        totalFocusSessions: 0
      }));
      useEffect(() => { storage.set('flow_stats_v2', stats); }, [stats]);

      const [mode, setMode] = useState('pomodoro'); // 'pomodoro' | 'stopwatch' | 'flowtime'
      const [phase, setPhase] = useState('focus');   // 'focus' | 'shortBreak' | 'longBreak'
      const [isRunning, setIsRunning] = useState(false);
      const [time, setTime] = useState(settings.pomodoroFocus * 60);
      const [duration, setDuration] = useState(settings.pomodoroFocus * 60);
      const [sessionCount, setSessionCount] = useState(0);

      const targetTimeRef = useRef(0);
      const stopwatchStartRef = useRef(0);
      const accumulatedMinsRef = useRef(0);

      // Apply preset values
      const applyPreset = (focus, short, name) => {
        setIsRunning(false);
        setSettings(s => ({ ...s, pomodoroFocus: focus, pomodoroShort: short, preset: name }));
        setPhase('focus');
        setDuration(focus * 60);
        setTime(focus * 60);
      };

      // Timer completion logic
      const handleComplete = useCallback(() => {
        soundEngine.playTone(settings.chimeSound);
        
        if (phase === 'focus') {
          const nextCount = sessionCount + 1;
          setSessionCount(nextCount);
          setStats(s => ({ ...s, totalFocusSessions: (s.totalFocusSessions || 0) + 1 }));

          notifier.dispatch('🎯 Focus Interval Completed!', 'Great flow session. Step back and recharge.');

          const isLong = nextCount % 4 === 0;
          const nextPhase = isLong ? 'longBreak' : 'shortBreak';
          const nextSecs = (isLong ? settings.pomodoroLong : settings.pomodoroShort) * 60;

          setPhase(nextPhase);
          setDuration(nextSecs);
          setTime(nextSecs);

          if (settings.autoStart) {
            targetTimeRef.current = Date.now() + nextSecs * 1000;
          } else {
            setIsRunning(false);
          }
        } else {
          // Break finished
          notifier.dispatch('⚡ Break Completed', 'Ready for the next sprint? Let\'s go.');
          setPhase('focus');
          const focusSecs = settings.pomodoroFocus * 60;
          setDuration(focusSecs);
          setTime(focusSecs);

          if (settings.autoStart) {
            targetTimeRef.current = Date.now() + focusSecs * 1000;
          } else {
            setIsRunning(false);
          }
        }
      }, [phase, sessionCount, settings, setStats]);

      // Main interval tick
      useEffect(() => {
        if (!isRunning) {
          wakeLock.release();
          return;
        }

        wakeLock.request();
        const interval = setInterval(() => {
          const now = Date.now();

          // Stopwatch / Flowtime count-up
          if (mode === 'stopwatch' || (mode === 'flowtime' && phase === 'focus')) {
            const elapsed = Math.floor((now - stopwatchStartRef.current) / 1000);
            setTime(elapsed);
            return;
          }

          // Countdown
          const remaining = Math.max(0, Math.ceil((targetTimeRef.current - now) / 1000));
          setTime(remaining);

          // Log daily minutes for focus phase
          if (phase === 'focus') {
            accumulatedMinsRef.current += 0.25;
            if (accumulatedMinsRef.current >= 60) {
              accumulatedMinsRef.current = 0;
              const today = new Date().toDateString();
              setStats(prev => {
                const dayMins = (prev.history[today] || 0) + 1;
                return {
                  ...prev,
                  history: { ...prev.history, [today]: dayMins },
                  todayMinutes: dayMins
                };
              });
            }
          }

          if (remaining <= 0) {
            handleComplete();
          }
        }, 250);

        return () => clearInterval(interval);
      }, [isRunning, mode, phase, handleComplete, setStats]);

      // Play / Pause toggle
      const toggle = () => {
        notifier.request(); // ensure notification permission prompt when user starts
        if (isRunning) {
          setIsRunning(false);
        } else {
          if (mode === 'stopwatch' || (mode === 'flowtime' && phase === 'focus')) {
            stopwatchStartRef.current = Date.now() - (time * 1000);
          } else {
            targetTimeRef.current = Date.now() + (time * 1000);
          }
          setIsRunning(true);
        }
      };

      const reset = () => {
        setIsRunning(false);
        if (mode === 'pomodoro') {
          const sec = (phase === 'focus' ? settings.pomodoroFocus : phase === 'shortBreak' ? settings.pomodoroShort : settings.pomodoroLong) * 60;
          setTime(sec);
          setDuration(sec);
        } else {
          setTime(0);
          setDuration(0);
        }
      };

      const skip = () => {
        if (confirm('Skip this interval?')) {
          handleComplete();
        }
      };

      // Synchronize document title
      useEffect(() => {
        const m = Math.floor(time / 60).toString().padStart(2, '0');
        const s = (time % 60).toString().padStart(2, '0');
        const stateStr = isRunning ? (phase === 'focus' ? '🎯' : '☕') : '⏸';
        document.title = `${stateStr} ${m}:${s} - FLOW`;
      }, [time, isRunning, phase]);

      return {
        time, duration, phase, mode, sessionCount, isRunning,
        settings, setSettings, stats, setStats,
        toggle, reset, skip, applyPreset, setMode
      };
    }

    function useTaskManager() {
      const [tasks, setTasks] = useState(() => storage.get('flow_tasklist_v2', [
        { id: '1', title: 'Draft project architecture proposal', completed: false, est: 3, act: 1, priority: true, tag: 'work' },
        { id: '2', title: 'Review merge requests & telemetry logs', completed: false, est: 2, act: 0, priority: false, tag: 'code' },
        { id: '3', title: 'Deep stretch & hydration session', completed: true, est: 1, act: 1, priority: false, tag: 'health' }
      ]));
      useEffect(() => { storage.set('flow_tasklist_v2', tasks); }, [tasks]);

      const [activeId, setActiveId] = useState(() => storage.get('flow_active_task_id', '1'));
      useEffect(() => { storage.set('flow_active_task_id', activeId); }, [activeId]);

      const activeTask = useMemo(() => tasks.find(t => t.id === activeId), [tasks, activeId]);

      const addTask = (title, tag = 'work', est = 2, priority = false) => {
        if (!title.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          title: title.trim(),
          completed: false,
          est: Number(est) || 1,
          act: 0,
          priority: Boolean(priority),
          tag: tag.toLowerCase() || 'general'
        };
        setTasks(prev => [newTask, ...prev]);
        if (!activeId) setActiveId(newTask.id);
      };

      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => {
          if (t.id === id) {
            const nextState = !t.completed;
            if (nextState && activeId === id) setActiveId(null);
            return { ...t, completed: nextState };
          }
          return t;
        }));
      };

      const deleteTask = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id));
        if (activeId === id) setActiveId(null);
      };

      const incrementAct = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, act: t.act + 1 } : t));
      };

      const updateTaskTitle = (id, newTitle) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, title: newTitle } : t));
      };

      const clearCompleted = () => {
        setTasks(prev => prev.filter(t => !t.completed));
      };

      return {
        tasks, activeTask, activeId, setActiveId,
        addTask, toggleTask, deleteTask, incrementAct,
        updateTaskTitle, clearCompleted
      };
    }

    // --- UI ATOMS & ICONS ---
    const Icons = {
      Play: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>,
      Pause: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>,
      Reset: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>,
      Skip: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>,
      Check: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
      Trash: () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      Tasks: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
      Music: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
      Stats: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>,
      Settings: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Zen: () => <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>,

    // --- RESPONSIVE SVG TIMER RING ---
    function TimerDisplay({ time, duration, isRunning, phase, accentColor, onToggle }) {
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      const progress = duration > 0 ? (duration - time) / duration : 1;
      const strokeDashoffset = circumference - progress * circumference;

      const minutes = Math.floor(time / 60).toString().padStart(2, '0');
      const seconds = (time % 60).toString().padStart(2, '0');

      return (
        <div className="relative flex items-center justify-center cursor-pointer group select-none" onClick={onToggle}>
          {/* Subtle Ambient Radial Glow */}
          <div 
            className="absolute inset-0 rounded-full blur-3xl opacity-20 transition-all duration-700 pointer-events-none"
            style={{ backgroundColor: accentColor, transform: isRunning ? 'scale(1.1)' : 'scale(0.9)' }}
          />

          <svg className="w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 -rotate-90 transform" viewBox="0 0 100 100">
            {/* Background Track */}
            <circle
              cx="50" cy="50" r={radius}
              className="stroke-white/5"
              strokeWidth="2.5"
              fill="transparent"
            />
            {/* Rotating Tech Grid Circle */}
            <circle
              cx="50" cy="50" r={radius - 4}
              className="stroke-white/10"
              strokeWidth="0.8"
              strokeDasharray="1 3"
              fill="transparent"
            />
            {/* Dynamic Progress Meter */}
            <circle
              cx="50" cy="50" r={radius}
              stroke={accentColor}
              strokeWidth="3.2"
              strokeDasharray={circumference}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
              fill="transparent"
              style={{
                transition: 'stroke-dashoffset 0.4s ease-out',
                filter: `drop-shadow(0 0 8px ${accentColor}80)`
              }}
            />
          </svg>

          {/* Centered Time HUD */}
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="text-xs uppercase tracking-[0.3em] font-mono text-gray-400 mb-1">
              {phase === 'focus' ? 'Focus Interval' : phase === 'shortBreak' ? 'Rest Interval' : 'Long Break'}
            </span>
            <div className="text-6xl sm:text-7xl md:text-8xl font-light font-mono tracking-tight text-white flex items-center justify-center">
              <span>{minutes}</span>
              <span className="opacity-40 animate-pulse">:</span>
              <span>{seconds}</span>
            </div>
            
            {/* Action State Indicator Pill */}
            <div className={`mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 ${
              isRunning ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-white/5 text-gray-400 border border-white/10'
            }`}>
              <span className={`w-1.5 h-1.5 rounded-full ${isRunning ? 'bg-emerald-400 animate-ping' : 'bg-gray-400'}`} />
              {isRunning ? 'Running' : 'Paused (Click to Start)'}
            </div>
          </div>
        </div>
      );
    }

        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handler);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
          {/* Backdrop */}
          <div 
            className="absolute inset-0 bg-black/70 backdrop-blur-md transition-opacity duration-300"

              />
              <button

                  className="bg-transparent text-white focus:outline-none capitalize font-medium"
                >
                  <option value="work" className="bg-[#12121a]">Work</option>
                  <option value="study" className="bg-[#12121a]">Study</option>

            <div className="flex gap-1">
              {['all', 'active', 'done'].map(f => (
                <button

              <div className="text-center py-10 text-gray-500 text-xs tracking-widest uppercase">

                  <div

                        : 'bg-white/5 border-white/5 hover:border-white/15'

                  >
                    {/* Checkbox */}
                    <button
                      onClick={() => toggleTask(t.id)}
                      className={`w-5 h-5 rounded-lg border flex items-center justify-center shrink-0 transition-colors ${

                          onBlur={() => saveEdit(t.id)}

                          className="w-full bg-black/40 border border-blue-500/50 rounded px-2 py-0.5 text-sm text-white focus:outline-none"

                        <div

                          {t.title}

                      <div className="flex items-center gap-2 mt-1">
                        <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-widest bg-white/5 px-2 py-0.5 rounded">
                          #{t.tag}

                        {/* Pomodoro Tracker */}
                        <div 
                          className="flex items-center gap-1 cursor-pointer"

                            {t.act}/{t.est}

                      <button

                      >

                    {/* Delete */}
                    <button
                      onClick={() => deleteTask(t.id)}
                      className="opacity-0 group-hover:opacity-100 p-1.5 text-gray-500 hover:text-red-400 transition-opacity"
                    >
                      <Icons.Trash />
                    </button>
                  </div>

        </div>

    // --- ROOT APP ---
    function App() {
      const timer = useTimer();
      const taskManager = useTaskManager();

      const [isZenMode, setIsZenMode] = useState(false);

      // Keyboard Shortcut Map
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const key = e.key.toLowerCase();
          if (e.code === 'Space') {
            e.preventDefault();
            timer.toggle();
          } else if (key === 'r') {
            timer.reset();
          } else if (key === 'z') {
            setIsZenMode(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [timer]);

      return (
        <div className="min-h-screen flex flex-col justify-between relative overflow-hidden bg-grid-cyber pb-28 sm:pb-8">
          
          {/* Top Bar Navigation */}

            isZenMode ? 'opacity-0 pointer-events-none' : 'opacity-100'

              <div 
                className="w-3 h-3 rounded-full animate-pulse-glow"
                style={{ backgroundColor: timer.settings.accentColor }}

                  className={`px-3 py-1 rounded-full text-xs font-mono font-medium transition-all ${

                  {p.name}

                  <span className="w-2 h-2 rounded-full animate-ping" style={{ backgroundColor: timer.settings.accentColor }} />
                  <span className="text-xs font-semibold text-gray-200 truncate max-w-[240px] sm:max-w-md">
                    {taskManager.activeTask.title}
                  </span>
                  <span className="text-xs font-mono text-gray-400">
                    🍅 {taskManager.activeTask.act}/{taskManager.activeTask.est}
                  </span>
                </div>
              </div>
            )}

            {/* Circular Timer Ring */}
            <TimerDisplay
              time={timer.time}
              duration={timer.duration}
              isRunning={timer.isRunning}
              phase={timer.phase}
              accentColor={timer.settings.accentColor}
              onToggle={timer.toggle}
            />

            {/* Primary Action Controls */}
            <div className={`mt-8 flex items-center gap-4 transition-all duration-500 ${
              isZenMode ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100 scale-100'
            }`}>
              {/* Reset */}
              <button
                onClick={timer.reset}
                title="Reset Timer"
                className="p-3.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 transition-all active:scale-95 border border-white/5"
              >
                <Icons.Reset />
              </button>

              {/* Central Play/Pause Button */}
              <button
                onClick={timer.toggle}
                className="px-8 py-4 rounded-full text-black font-bold uppercase tracking-widest text-sm flex items-center gap-3 shadow-xl transition-all duration-200 active:scale-95"
                style={{
                  backgroundColor: timer.isRunning ? '#ffffff' : timer.settings.accentColor,
                  boxShadow: `0 0 30px ${timer.settings.accentColor}40`
                }}
              >
                {timer.isRunning ? <Icons.Pause /> : <Icons.Play />}
                <span>{timer.isRunning ? 'Pause' : 'Start Focus'}</span>
              </button>

              {/* Skip */}
              <button
                onClick={timer.skip}
                title="Skip to next"
                className="p-3.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 transition-all active:scale-95 border border-white/5"
              >
                <Icons.Skip />
              </button>
            </div>
          </main>

          {/* Bottom Floating App Dock */}
          <nav className={`fixed bottom-5 left-1/2 -translate-x-1/2 glass px-3 py-2 rounded-full flex items-center gap-1 sm:gap-2 shadow-2xl z-30 transition-all duration-500 ${
            isZenMode ? 'opacity-0 translate-y-10 pointer-events-none' : 'opacity-100 translate-y-0'
          }`}>
            <button
              onClick={() => setDrawerOpen('tasks')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'tasks' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white hover:bg-white/5'
              }`}
            >
              <Icons.Tasks />
              <span className="hidden sm:inline">Tasks</span>
              {taskManager.tasks.filter(t => !t.completed).length > 0 && (
                <span className="w-5 h-5 rounded-full bg-blue-500 text-black font-mono text-[10px] flex items-center justify-center font-bold">
                  {taskManager.tasks.filter(t => !t.completed).length}
                </span>
              )}
            </button>

            <button
              onClick={() => setDrawerOpen('audio')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'audio' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white hover:bg-white/5'
              }`}
            >
              <Icons.Music />
              <span className="hidden sm:inline">Ambience</span>
            </button>

            <button
              onClick={() => setDrawerOpen('stats')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'stats' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white hover:bg-white/5'
              }`}
            >
              <Icons.Stats />
              <span className="hidden sm:inline">Telemetry</span>
            </button>

            <button
              onClick={() => setDrawerOpen('settings')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'settings' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white hover:bg-white/5'
              }`}
            >
              <Icons.Settings />
              <span className="hidden sm:inline">System</span>
            </button>
          </nav>

          {/* Drawer Panels */}
          <Drawer
            isOpen={drawerOpen === 'tasks'}
            onClose={() => setDrawerOpen(null)}
            title="Task Database"
          >
            <TaskPanelContent
              taskManager={taskManager}
              accentColor={timer.settings.accentColor}
            />
          </Drawer>

          <Drawer
            isOpen={drawerOpen === 'audio'}
            onClose={() => setDrawerOpen(null)}
            title="Audio Matrix & Ambience"
          >
            <AudioPanelContent
              accentColor={timer.settings.accentColor}
            />
          </Drawer>

          <Drawer
            isOpen={drawerOpen === 'stats'}
            onClose={() => setDrawerOpen(null)}
            title="Focus Telemetry"
          >
            <StatsPanelContent
              stats={timer.stats}
              accentColor={timer.settings.accentColor}
            />
          </Drawer>

          <Drawer
            isOpen={drawerOpen === 'settings'}
            onClose={() => setDrawerOpen(null)}
            title="System Parameters"
          >
            <SettingsPanelContent
              settings={timer.settings}
              setSettings={timer.setSettings}
            />
          </Drawer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
