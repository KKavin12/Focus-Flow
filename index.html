<body class="selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- STORAGE & INDEXEDDB ENGINE FOR CUSTOM AUDIO ---
    const storage = {
      get: (k, d) => { try { const i = window.localStorage.getItem(k); return i ? JSON.parse(i) : d; } catch (e) { return d; } },
      set: (k, v) => { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    };

    const idb = {
      db: null,
      async init() {
        if (this.db) return this.db;
        return new Promise((res, rej) => {
          const req = indexedDB.open('flow_music_vault_v3', 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('tracks')) {
              db.createObjectStore('tracks', { keyPath: 'id' });
            }
          };
          req.onsuccess = e => { this.db = e.target.result; res(this.db); };
          req.onerror = () => rej();
        });
      },
      async saveTrack(track) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').put(track);
          tx.oncomplete = () => res();
        });
      },
      async getAllTracks() {
        try {
          const db = await this.init();
          return new Promise(res => {
            const tx = db.transaction('tracks', 'readonly');
            const r = tx.objectStore('tracks').getAll();
            r.onsuccess = () => res(r.result || []);
          });
        } catch(e) { return []; }
      },
      async deleteTrack(id) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').delete(id);
          tx.oncomplete = () => res();
        });
      },
      async clearTracks() {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').clear();
          tx.oncomplete = () => res();
        });
      }
    };

    // --- SOUND ENGINE (AMBIENCE + CHIMES) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.nodes = {};
      }
      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
      }
      playTone(type = 'bell') {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (type === 'digital') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'bell') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
          osc.start(now);
          osc.stop(now + 1.8);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(528, now); // 528Hz Solfeggio frequency
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
          osc.start(now);
          osc.stop(now + 1.4);
        }
      }
      startAmbience(type, volume = 0.5) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.nodes[type]) {
          this.setAmbienceVolume(type, volume);
          return;
        }

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(volume, this.ctx.currentTime);
        g.connect(this.masterGain);

        if (type === 'brown') {
          const bufferSize = 2 * this.ctx.sampleRate;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.02 * white) / 1.02;
            lastOut = data[i];
            data[i] *= 3.5;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;
          src.connect(g);
          src.start();
          this.nodes.brown = { src, gain: g };
        } else if (type === 'rain') {
          const bufferSize = 2 * this.ctx.sampleRate;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = buffer;
          src.loop = true;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1100;
          filter.Q.value = 0.7;
          src.connect(filter).connect(g);
          src.start();
          this.nodes.rain = { src, gain: g };
        } else if (type === 'hum') {
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = 55; // 55Hz Cosmic Deep Hum
          osc.connect(g);
          osc.start();
          this.nodes.hum = { src: osc, gain: g };
        } else if (type === 'binaural') {
          const oscL = this.ctx.createOscillator();
          const oscR = this.ctx.createOscillator();
          oscL.type = 'sine'; oscL.frequency.value = 200;
          oscR.type = 'sine'; oscR.frequency.value = 214; // 14Hz Beta/Flow
          const merger = this.ctx.createChannelMerger(2);
          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(g);
          oscL.start(); oscR.start();
          this.nodes.binaural = { src: [oscL, oscR], gain: g };
        }
      }
      setAmbienceVolume(type, vol) {
        if (this.nodes[type] && this.ctx) {
          this.nodes[type].gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.05);
        }
      }
      stopAmbience(type) {
        if (this.nodes[type]) {
          try {
            if (Array.isArray(this.nodes[type].src)) {
              this.nodes[type].src.forEach(s => s.stop());
            } else {
              this.nodes[type].src.stop();
            }
          } catch(e) {}
          delete this.nodes[type];
        }
      }
    }
    const soundEngine = new SoundEngine();

    // --- NOTIFICATIONS & WAKE LOCK ---
    const notifier = {
      async request() {
        if ('Notification' in window && Notification.permission !== 'granted') {
          await Notification.requestPermission();
        }
      },
      dispatch(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body,
              icon: 'https://cdn-icons-png.flaticon.com/512/850/850960.png'
            });
          } catch(e) {}
        }
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
      }
    };

    let wakeLockSentinel = null;
    const wakeLock = {
      async request() {
        try {
          if ('wakeLock' in navigator) wakeLockSentinel = await navigator.wakeLock.request('screen');
        } catch(e) {}
      },
      release() {
        if (wakeLockSentinel) {
          wakeLockSentinel.release().catch(()=>{});
          wakeLockSentinel = null;
        }
      }
    };

    // --- HOOK: CUSTOM AUDIO PLAYER (UPLOAD & PLAYBACK) ---
    function useMusicPlayer(isBreak) {
      const [playlist, setPlaylist] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [repeatMode, setRepeatMode] = useState('all'); // 'off' | 'all' | 'one'
      const [isShuffle, setIsShuffle] = useState(false);
      const [duckOnBreak, setDuckOnBreak] = useState(true);

      const audioRef = useRef(new Audio());
      const currentTrack = playlist[currentIndex] || null;

      // Load tracks from IndexedDB on startup
      useEffect(() => {
        idb.getAllTracks().then(tracks => {
          const loaded = tracks.map(t => ({
            ...t,
            url: URL.createObjectURL(t.file)
          }));
          setPlaylist(loaded);
        });
      }, []);

      // Handle Audio Element events
      useEffect(() => {
        const audio = audioRef.current;
        const handleTimeUpdate = () => setCurrentTime(audio.currentTime);
        const handleLoadedMetadata = () => setDuration(audio.duration || 0);
        const handleEnded = () => {
          if (repeatMode === 'one') {
            audio.currentTime = 0;
            audio.play();
          } else if (repeatMode === 'all') {
            handleNext();
          } else {
            if (currentIndex < playlist.length - 1) handleNext();
            else setIsPlaying(false);
          }
        };

        audio.addEventListener('timeupdate', handleTimeUpdate);
        audio.addEventListener('loadedmetadata', handleLoadedMetadata);
        audio.addEventListener('ended', handleEnded);

        return () => {
          audio.removeEventListener('timeupdate', handleTimeUpdate);
          audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
          audio.removeEventListener('ended', handleEnded);
        };
      }, [repeatMode, playlist.length, currentIndex]);

      // Volume & Ducking Control
      useEffect(() => {
        const effectiveVolume = isBreak && duckOnBreak ? volume * 0.3 : volume;
        audioRef.current.volume = Math.max(0, Math.min(1, effectiveVolume));
      }, [volume, isBreak, duckOnBreak]);

      const playTrackAtIndex = (index) => {
        if (!playlist[index]) return;
        setCurrentIndex(index);
        audioRef.current.src = playlist[index].url;
        audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
      };

      const togglePlay = () => {
        if (!currentTrack) {
          if (playlist.length > 0) playTrackAtIndex(0);
          return;
        }
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
        }
      };

      const handleNext = () => {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (isShuffle) {
          nextIndex = Math.floor(Math.random() * playlist.length);
        } else if (nextIndex >= playlist.length) {
          nextIndex = 0;
        }
        playTrackAtIndex(nextIndex);
      };

      const handlePrev = () => {
        if (playlist.length === 0) return;
        if (audioRef.current.currentTime > 3) {
          audioRef.current.currentTime = 0;
          return;
        }
        const prevIndex = currentIndex - 1 < 0 ? playlist.length - 1 : currentIndex - 1;
        playTrackAtIndex(prevIndex);
      };

      const seek = (time) => {
        audioRef.current.currentTime = time;
        setCurrentTime(time);
      };

      const addTracks = async (files) => {
        const valid = Array.from(files).filter(f => f.type.startsWith('audio/'));
        const newItems = [];
        for (const f of valid) {
          const trackItem = {
            id: Date.now() + '-' + Math.random().toString(36).substring(2, 7),
            name: f.name.replace(/\.[^/.]+$/, ""),
            size: (f.size / (1024 * 1024)).toFixed(1) + ' MB',
            file: f
          };
          await idb.saveTrack(trackItem);
          trackItem.url = URL.createObjectURL(f);
          newItems.push(trackItem);
        }
        setPlaylist(prev => [...prev, ...newItems]);
      };

      const removeTrack = async (id) => {
        await idb.deleteTrack(id);
        setPlaylist(prev => {
          const filtered = prev.filter(t => t.id !== id);
          if (currentTrack?.id === id) {
            audioRef.current.pause();
            setIsPlaying(false);
          }
          return filtered;
        });
      };

      return {
        playlist, currentTrack, isPlaying, currentTime, duration,
        volume, setVolume, repeatMode, setRepeatMode, isShuffle, setIsShuffle,
        duckOnBreak, setDuckOnBreak,
        togglePlay, handleNext, handlePrev, seek, addTracks, removeTrack, playTrackAtIndex
      };
    }

    // --- HOOK: TIMER SYSTEM WITH QUICK ADJUSTMENTS ---
    function useTimer() {
      const [settings, setSettings] = useState(() => storage.get('flow_settings_v3', {
        pomodoroFocus: 25,
        pomodoroShort: 5,
        pomodoroLong: 15,
        autoStart: true,
        chimeSound: 'bell',
        accentColor: '#3b82f6',
        preset: '25/5'
      }));
      useEffect(() => { storage.set('flow_settings_v3', settings); }, [settings]);

      const [stats, setStats] = useState(() => storage.get('flow_stats_v3', {
        history: {},
        todayMinutes: 0,
        streak: 1,
        totalSessions: 0
      }));
      useEffect(() => { storage.set('flow_stats_v3', stats); }, [stats]);

      const [mode, setMode] = useState('pomodoro'); // 'pomodoro' | 'flowtime' | 'stopwatch'
      const [phase, setPhase] = useState('focus');   // 'focus' | 'shortBreak' | 'longBreak' | 'flowBreak'
      const [isRunning, setIsRunning] = useState(false);
      const [time, setTime] = useState(settings.pomodoroFocus * 60);
      const [duration, setDuration] = useState(settings.pomodoroFocus * 60);
      const [sessionCount, setSessionCount] = useState(0);

      const targetRef = useRef(0);
      const countUpStartRef = useRef(0);
      const accumulatedSecsRef = useRef(0);

      const applyPreset = (focus, rest, presetName) => {
        setIsRunning(false);
        setSettings(s => ({ ...s, pomodoroFocus: focus, pomodoroShort: rest, preset: presetName }));
        setPhase('focus');
        setDuration(focus * 60);
        setTime(focus * 60);
      };

      // On-the-fly adjustment (+1m, +5m, -5m)
      const adjustTime = (deltaMinutes) => {
        const deltaSeconds = deltaMinutes * 60;
        if (mode === 'pomodoro') {
          const newTime = Math.max(10, time + deltaSeconds);
          setTime(newTime);
          setDuration(d => Math.max(newTime, d + deltaSeconds));
          if (isRunning) targetRef.current += deltaSeconds * 1000;
        } else {
          // Flowtime / Stopwatch count-up adjust
          countUpStartRef.current -= deltaSeconds * 1000;
          setTime(t => Math.max(0, t + deltaSeconds));
        }
      };

      const handleComplete = useCallback(() => {
        soundEngine.playTone(settings.chimeSound);

        if (mode === 'pomodoro') {
          if (phase === 'focus') {
            const nextCount = sessionCount + 1;
            setSessionCount(nextCount);
            setStats(s => ({ ...s, totalSessions: (s.totalSessions || 0) + 1 }));
            notifier.dispatch('🎯 Focus Interval Completed!', 'Take a well-deserved break.');

            const isLong = nextCount % 4 === 0;
            const nextPhase = isLong ? 'longBreak' : 'shortBreak';
            const nextSecs = (isLong ? settings.pomodoroLong : settings.pomodoroShort) * 60;

            setPhase(nextPhase);
            setDuration(nextSecs);
            setTime(nextSecs);
            if (settings.autoStart) targetRef.current = Date.now() + nextSecs * 1000;
            else setIsRunning(false);
          } else {
            notifier.dispatch('⚡ Break Completed', 'Ready for your next power session?');
            setPhase('focus');
            const focusSecs = settings.pomodoroFocus * 60;
            setDuration(focusSecs);
            setTime(focusSecs);
            if (settings.autoStart) targetRef.current = Date.now() + focusSecs * 1000;
            else setIsRunning(false);
          }
        } else if (mode === 'flowtime' && phase === 'focus') {
          // Break time is 1/5th of time focused
          const breakSecs = Math.max(60, Math.floor(time / 5));
          notifier.dispatch('🌊 Flow Session Ended', `Calculated Break: ${Math.round(breakSecs / 60)} minutes.`);
          setPhase('flowBreak');
          setDuration(breakSecs);
          setTime(breakSecs);
          targetRef.current = Date.now() + breakSecs * 1000;
          setIsRunning(true);
        } else if (mode === 'flowtime' && phase === 'flowBreak') {
          notifier.dispatch('⚡ Break Over', 'Return to your natural flow state.');
          setPhase('focus');
          setTime(0);
          setDuration(0);
          countUpStartRef.current = Date.now();
          setIsRunning(true);
        }
      }, [mode, phase, sessionCount, settings, time, setStats]);

      useEffect(() => {
        if (!isRunning) {
          wakeLock.release();
          return;
        }
        wakeLock.request();

        const interval = setInterval(() => {
          const now = Date.now();
          if (mode === 'stopwatch' || (mode === 'flowtime' && phase === 'focus')) {
            const elapsed = Math.floor((now - countUpStartRef.current) / 1000);
            setTime(elapsed);
            return;
          }

          const rem = Math.max(0, Math.ceil((targetRef.current - now) / 1000));
          setTime(rem);

          // Track focused minutes
          if (phase === 'focus') {
            accumulatedSecsRef.current += 0.25;
            if (accumulatedSecsRef.current >= 60) {
              accumulatedSecsRef.current = 0;
              const today = new Date().toDateString();
              setStats(s => ({
                ...s,
                history: { ...s.history, [today]: (s.history[today] || 0) + 1 },
                todayMinutes: (s.history[today] || 0) + 1
              }));
            }
          }

          if (rem <= 0) handleComplete();
        }, 250);

        return () => clearInterval(interval);
      }, [isRunning, mode, phase, handleComplete, setStats]);

      const toggle = () => {
        notifier.request();
        if (isRunning) {
          setIsRunning(false);
        } else {
          if (mode === 'stopwatch' || (mode === 'flowtime' && phase === 'focus')) {
            countUpStartRef.current = Date.now() - (time * 1000);
          } else {
            targetRef.current = Date.now() + (time * 1000);
          }
          setIsRunning(true);
        }
      };

      const reset = () => {
        setIsRunning(false);
        if (mode === 'pomodoro') {
          const sec = (phase === 'focus' ? settings.pomodoroFocus : phase === 'shortBreak' ? settings.pomodoroShort : settings.pomodoroLong) * 60;
          setTime(sec);
          setDuration(sec);
        } else {
          setTime(0);
          setDuration(0);
        }
      };

      const skip = () => {
        if (confirm('Advance to next interval?')) handleComplete();
      };

      useEffect(() => {
        const m = Math.floor(time / 60).toString().padStart(2, '0');
        const s = (time % 60).toString().padStart(2, '0');
        const badge = isRunning ? (phase === 'focus' ? '🎯' : '☕') : '⏸';
        document.title = `${badge} ${m}:${s} - FLOW`;
      }, [time, isRunning, phase]);

      return {
        time, duration, phase, mode, sessionCount, isRunning,
        settings, setSettings, stats, setStats,
        toggle, reset, skip, applyPreset, adjustTime, setMode
      };
    }

    // --- HOOK: TASK MANAGER WITH SUBTASKS & TARGETS ---
    function useTaskManager() {
      const [tasks, setTasks] = useState(() => storage.get('flow_tasks_v3', [
        {
          id: '1',
          title: 'Design distributed storage layer',
          completed: false,
          est: 3,
          act: 1,
          priority: true,
          tag: 'arch',
          subtasks: [
            { id: 's1', title: 'Evaluate IndexedDB vs SQLite WASM', completed: true },
            { id: 's2', title: 'Build cache eviction policy', completed: false }
          ]
        },
        {
          id: '2',
          title: 'Deep focus coding sprint',
          completed: false,
          est: 4,
          act: 2,
          priority: false,
          tag: 'code',
          subtasks: []
        }
      ]));
      useEffect(() => { storage.set('flow_tasks_v3', tasks); }, [tasks]);

      const [activeId, setActiveId] = useState(() => storage.get('flow_active_task_id_v3', '1'));
      useEffect(() => { storage.set('flow_active_task_id_v3', activeId); }, [activeId]);

      const activeTask = useMemo(() => tasks.find(t => t.id === activeId), [tasks, activeId]);

      const addTask = (title, tag = 'work', est = 2, priority = false) => {
        if (!title.trim()) return;
        const nt = {
          id: Date.now().toString(),
          title: title.trim(),
          completed: false,
          est: Number(est) || 1,
          act: 0,
          priority: Boolean(priority),
          tag: tag.toLowerCase() || 'general',
          subtasks: []
        };
        setTasks(p => [nt, ...p]);
        if (!activeId) setActiveId(nt.id);
      };

      const toggleTask = (id) => {
        setTasks(p => p.map(t => {
          if (t.id === id) {
            const nextState = !t.completed;
            if (nextState && activeId === id) setActiveId(null);
            return { ...t, completed: nextState };
          }
          return t;
        }));
      };

      const deleteTask = (id) => {
        setTasks(p => p.filter(t => t.id !== id));
        if (activeId === id) setActiveId(null);
      };

      const updateTaskTitle = (id, title) => {
        setTasks(p => p.map(t => t.id === id ? { ...t, title } : t));
      };

      const incrementAct = (id) => {
        setTasks(p => p.map(t => t.id === id ? { ...t, act: t.act + 1 } : t));
      };

      const addSubtask = (taskId, title) => {
        if (!title.trim()) return;
        setTasks(p => p.map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              subtasks: [...t.subtasks, { id: Date.now().toString(), title: title.trim(), completed: false }]
            };
          }
          return t;
        }));
      };

      const toggleSubtask = (taskId, subId) => {
        setTasks(p => p.map(t => {
          if (t.id === taskId) {
            return {
              ...t,
              subtasks: t.subtasks.map(st => st.id === subId ? { ...st, completed: !st.completed } : st)
            };
          }
          return t;
        }));
      };

      const clearCompleted = () => {
        setTasks(p => p.filter(t => !t.completed));
      };

      return {
        tasks, activeTask, activeId, setActiveId,
        addTask, toggleTask, deleteTask, updateTaskTitle, incrementAct,
        addSubtask, toggleSubtask, clearCompleted
      };
    }

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // --- RESPONSIVE SVG RING ---
    function TimerRing({ time, duration, isRunning, phase, accentColor, onToggle, onAdjust }) {
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      const progress = duration > 0 ? (duration - time) / duration : 1;
      const strokeDashoffset = circumference - progress * circumference;

      const m = Math.floor(time / 60).toString().padStart(2, '0');
      const s = (time % 60).toString().padStart(2, '0');

      return (
        <div className="relative flex flex-col items-center justify-center">
          <div className="relative flex items-center justify-center select-none cursor-pointer" onClick={onToggle}>
            <div 
              className="absolute inset-0 rounded-full blur-3xl opacity-20 transition-all duration-700 pointer-events-none"
              style={{ backgroundColor: accentColor, transform: isRunning ? 'scale(1.12)' : 'scale(0.88)' }}
            />

            <svg className="w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 -rotate-90 transform" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r={radius} className="stroke-white/5" strokeWidth="2.5" fill="transparent" />
              <circle cx="50" cy="50" r={radius - 4} className="stroke-white/10" strokeWidth="0.8" strokeDasharray="1 3" fill="transparent" />
              <circle
                cx="50" cy="50" r={radius}
                stroke={accentColor}
                strokeWidth="3.2"
                strokeDasharray={circumference}
                strokeDashoffset={strokeDashoffset}
                strokeLinecap="round"
                fill="transparent"
                style={{
                  transition: 'stroke-dashoffset 0.4s ease-out',
                  filter: `drop-shadow(0 0 8px ${accentColor}80)`
                }}
              />
            </svg>

            <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
              <span className="text-[11px] uppercase tracking-[0.3em] font-mono text-gray-400 mb-1">
                {phase === 'focus' ? 'Deep Work Interval' : phase === 'shortBreak' ? 'Short Recess' : 'Long Rejuvenation'}
              </span>
              <div className="text-6xl sm:text-7xl md:text-8xl font-light font-mono tracking-tight text-white flex items-center justify-center">
                <span>{m}</span>
                <span className="opacity-40 animate-pulse">:</span>
                <span>{s}</span>
              </div>
              <div className={`mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 ${
                isRunning ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-white/5 text-gray-400 border border-white/10'
              }`}>
                <span className={`w-1.5 h-1.5 rounded-full ${isRunning ? 'bg-emerald-400 animate-ping' : 'bg-gray-400'}`} />
                {isRunning ? 'Flow Running' : 'Session Paused'}
              </div>
            </div>
          </div>

          {/* ON-THE-FLY TIME ADJUSTMENT STEPPERS */}
          <div className="flex items-center gap-2 mt-4">
            <button
              onClick={() => onAdjust(-5)}
              className="px-2.5 py-1 text-xs font-mono font-semibold rounded-lg bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 border border-white/5 transition-all"
            >
              -5m
            </button>
            <button
              onClick={() => onAdjust(1)}
              className="px-2.5 py-1 text-xs font-mono font-semibold rounded-lg bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 border border-white/5 transition-all"
            >
              +1m
            </button>
            <button
              onClick={() => onAdjust(5)}
              className="px-2.5 py-1 text-xs font-mono font-semibold rounded-lg bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 border border-white/5 transition-all"
            >
              +5m
            </button>
          </div>
        </div>

    // --- DRAWER MODAL ---
    function Drawer({ isOpen, onClose, title, children }) {
      useEffect(() => {
        const handler = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [onClose]);

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
          <div className="absolute inset-0 bg-black/70 backdrop-blur-md" onClick={onClose} />

          addTask(newTitle, newTag, newEst);

                  className={`px-3 py-1 rounded-lg text-xs font-semibold capitalize ${

                            placeholder="New sub-step..."

    // --- AUDIO & CUSTOM MUSIC PLAYER PANEL ---

                  <Icons.Prev />
                </button>
                <button
                  onClick={togglePlay}
                  className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center shadow-lg active:scale-95"
                >
                  {isPlaying ? <Icons.Pause /> : <Icons.Play />}
                </button>
                <button onClick={handleNext} className="p-2 text-gray-300 hover:text-white">
                  <Icons.Next />
                </button>
              </div>

              <div className="flex items-center gap-1.5">
                <span className="text-xs text-gray-400">🔊</span>
                <input
                  type="range" min="0" max="1" step="0.05"
                  value={volume}
                  onChange={e => setVolume(parseFloat(e.target.value))}
                  className="w-16"
                />
              </div>
            </div>
          </div>

          {/* Upload Custom Music Section */}
          <div 
            onClick={() => fileInputRef.current.click()}
            className="border-2 border-dashed border-white/10 hover:border-blue-500/50 rounded-2xl p-4 text-center cursor-pointer bg-white/[0.02] hover:bg-white/[0.04] transition-all"
          >
            <input 
              type="file" 
              ref={fileInputRef} 
              multiple 
              accept="audio/*" 
              className="hidden" 
              onChange={e => { if (e.target.files?.length) addTracks(e.target.files); }}
            />
            <div className="flex flex-col items-center gap-1">
              <Icons.Upload />
              <div className="text-xs font-bold uppercase tracking-wider text-gray-200 mt-1">Upload Music Files</div>
              <div className="text-[10px] text-gray-500 font-mono">Supports .MP3, .WAV, .FLAC, .OGG (Stored Offline)</div>
            </div>
          </div>

          {/* Playlist Table */}
          {playlist.length > 0 && (
            <div className="space-y-1.5 max-h-36 overflow-y-auto scrollbar-hide">
              {playlist.map((t, idx) => (
                <div
                  key={t.id}
                  onClick={() => playTrackAtIndex(idx)}
                  className={`flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs border ${
                    currentTrack?.id === t.id 
                      ? 'bg-blue-500/10 border-blue-500/40 text-blue-300' 
                      : 'bg-white/5 border-transparent text-gray-300 hover:bg-white/10'
                  }`}
                >
                  <div className="truncate flex-1 pr-2">
                    <span className="font-mono text-gray-500 mr-2">{idx + 1}.</span>
                    {t.name}
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-mono text-gray-500">{t.size}</span>
                    <button
                      onClick={(e) => { e.stopPropagation(); removeTrack(t.id); }}
                      className="text-gray-500 hover:text-red-400 p-1"
                    >
                      ✕
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Ambience Synthesizer Layer */}
          <div className="p-4 rounded-2xl bg-white/5 border border-white/5 space-y-3">
            <h4 className="text-[10px] uppercase font-mono tracking-widest text-gray-400 font-bold">
              Background Noise Generator
            </h4>
            <div className="grid grid-cols-2 gap-4 text-xs">
              <div>
                <div className="flex justify-between text-gray-300 mb-1">
                  <span>Brown Noise</span>
                  <span className="font-mono text-[10px]">{Math.round(ambience.brown * 100)}%</span>
                </div>
                <input
                  type="range" min="0" max="1" step="0.05"
                  value={ambience.brown}
                  onChange={e => handleAmbSlider('brown', e.target.value)}
                  className="w-full"
                />
              </div>

              <div>
                <div className="flex justify-between text-gray-300 mb-1">
                  <span>Rainfall</span>
                  <span className="font-mono text-[10px]">{Math.round(ambience.rain * 100)}%</span>
                </div>
                <input
                  type="range" min="0" max="1" step="0.05"
                  value={ambience.rain}
                  onChange={e => handleAmbSlider('rain', e.target.value)}
                  className="w-full"
                />
              </div>

              <div>
                <div className="flex justify-between text-gray-300 mb-1">
                  <span>Deep Cosmic Hum</span>
                  <span className="font-mono text-[10px]">{Math.round(ambience.hum * 100)}%</span>
                </div>
                <input
                  type="range" min="0" max="1" step="0.05"
                  value={ambience.hum}
                  onChange={e => handleAmbSlider('hum', e.target.value)}
                  className="w-full"
                />
              </div>

              <div>
                <div className="flex justify-between text-gray-300 mb-1">
                  <span>14Hz Flow Beat</span>
                  <span className="font-mono text-[10px]">{Math.round(ambience.binaural * 100)}%</span>
                </div>
                <input
                  type="range" min="0" max="1" step="0.05"
                  value={ambience.binaural}
                  onChange={e => handleAmbSlider('binaural', e.target.value)}
                  className="w-full"
                />
              </div>
            </div>

            <div className="pt-2 flex items-center justify-between">
              <label className="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
                <input
                  type="checkbox"
                  checked={duckOnBreak}
                  onChange={e => setDuckOnBreak(e.target.checked)}
                  className="w-3.5 h-3.5 rounded accent-blue-500"
                />
                Auto-dim volume during break intervals
              </label>
            </div>
          </div>
        </div>
      );
    }

    // --- SYSTEM PARAMETERS & BACKUP PANEL ---
    function SettingsContent({ timer, setSettings }) {
      const { settings } = timer;
      const update = (k, v) => setSettings(p => ({ ...p, [k]: v }));

      const handleExport = () => {
        const data = {
          settings,
          stats: timer.stats,
          tasks: storage.get('flow_tasks_v3', []),
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `flow-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.settings) storage.set('flow_settings_v3', data.settings);
            if (data.stats) storage.set('flow_stats_v3', data.stats);
            if (data.tasks) storage.set('flow_tasks_v3', data.tasks);
            alert('Backup successfully imported! Reloading...');
            window.location.reload();
          } catch(err) {
            alert('Invalid JSON file format.');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="space-y-6">
          <div className="p-4 rounded-2xl bg-white/5 border border-white/5 space-y-3">
            <h4 className="text-[10px] uppercase font-mono tracking-widest text-gray-400 font-bold">Interval Durations (Minutes)</h4>
            <div className="grid grid-cols-3 gap-3 text-center">
              <div>
                <label className="text-[10px] uppercase text-gray-400 block mb-1">Focus</label>
                <input
                  type="number" min="1" max="180"
                  value={settings.pomodoroFocus}
                  onChange={e => update('pomodoroFocus', parseInt(e.target.value) || 25)}
                  className="w-full bg-black/40 border border-white/10 rounded-xl py-2 text-center text-sm font-mono text-white focus:outline-none"
                />
              </div>
              <div>
                <label className="text-[10px] uppercase text-gray-400 block mb-1">Short Rest</label>
                <input
                  type="number" min="1" max="60"
                  value={settings.pomodoroShort}
                  onChange={e => update('pomodoroShort', parseInt(e.target.value) || 5)}
                  className="w-full bg-black/40 border border-white/10 rounded-xl py-2 text-center text-sm font-mono text-white focus:outline-none"
                />
              </div>
              <div>
                <label className="text-[10px] uppercase text-gray-400 block mb-1">Long Rest</label>
                <input
                  type="number" min="1" max="90"
                  value={settings.pomodoroLong}
                  onChange={e => update('pomodoroLong', parseInt(e.target.value) || 15)}
                  className="w-full bg-black/40 border border-white/10 rounded-xl py-2 text-center text-sm font-mono text-white focus:outline-none"
                />
              </div>
            </div>
          </div>

          <div className="p-4 rounded-2xl bg-white/5 border border-white/5 space-y-3">
            <h4 className="text-[10px] uppercase font-mono tracking-widest text-gray-400 font-bold">Chime Alert</h4>
            <div className="flex gap-2">
              {['bell', 'digital', 'chime'].map(sound => (
                <button
                  key={sound}
                  onClick={() => {
                    update('chimeSound', sound);
                    soundEngine.playTone(sound);
                  }}
                  className={`flex-1 py-2 rounded-xl text-xs font-semibold capitalize border ${
                    settings.chimeSound === sound ? 'border-blue-500 bg-blue-500/10 text-white' : 'border-white/10 text-gray-400'
                  }`}
                >
                  {sound}
                </button>
              ))}
            </div>
          </div>

          <div className="p-4 rounded-2xl bg-white/5 border border-white/5 space-y-3">
            <h4 className="text-[10px] uppercase font-mono tracking-widest text-gray-400 font-bold">Accent Core</h4>
            <div className="flex gap-3">
              {['#3b82f6', '#10b981', '#8b5cf6', '#f43f5e', '#f59e0b', '#06b6d4'].map(c => (
                <button
                  key={c}
                  onClick={() => update('accentColor', c)}
                  className={`w-8 h-8 rounded-full ${settings.accentColor === c ? 'ring-2 ring-white scale-110' : ''}`}
                  style={{ backgroundColor: c }}
                />
              ))}
            </div>
          </div>

          <div className="flex gap-3 pt-2">
            <button
              onClick={handleExport}
              className="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/15 text-xs font-bold uppercase tracking-wider text-white"
            >
              Export JSON
            </button>
            <label className="flex-1 py-3 rounded-xl border border-white/10 hover:bg-white/5 text-xs font-bold uppercase tracking-wider text-gray-300 text-center cursor-pointer">
              Import JSON
              <input type="file" accept=".json" onChange={handleImport} className="hidden" />
            </label>
          </div>
        </div>
      );
    }

    // --- MAIN APP CONTROLLER ---
    function App() {
      const timer = useTimer();
      const taskManager = useTaskManager();
      const isBreak = timer.phase.toLowerCase().includes('break');
      const musicPlayer = useMusicPlayer(isBreak);

      const [drawerOpen, setDrawerOpen] = useState(null);
      const [isZenMode, setIsZenMode] = useState(false);
      const [intention, setIntention] = useState(() => storage.get('flow_daily_intention', 'Ship next-gen architecture'));
      const [isEditingIntention, setIsEditingIntention] = useState(false);

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen().catch(()=>{});
      };

      // Keyboard Controls
      useEffect(() => {
        const handleKeys = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          const k = e.key.toLowerCase();
          if (e.code === 'Space') {
            e.preventDefault();
            timer.toggle();
          } else if (k === 'z') {
            setIsZenMode(p => !p);
          } else if (k === 'r') {
            timer.reset();
          }
        };
        window.addEventListener('keydown', handleKeys);
        return () => window.removeEventListener('keydown', handleKeys);
      }, [timer]);

      return (
        <div className="min-h-screen flex flex-col justify-between relative overflow-hidden bg-grid-cyber pb-28 sm:pb-8">
          
          {/* TOP BAR */}
          <header className={`w-full max-w-5xl mx-auto px-6 py-5 flex items-center justify-between transition-opacity duration-500 z-20 ${
            isZenMode ? 'opacity-0 pointer-events-none' : 'opacity-100'
          }`}>
            <div className="flex items-center gap-3">
              <div 
                className="w-3 h-3 rounded-full animate-pulse-glow"
                style={{ backgroundColor: timer.settings.accentColor }}
              />
              <span className="font-mono text-xs tracking-[0.25em] uppercase font-bold text-gray-300">
                FLOW // HUD
              </span>
            </div>

            {/* Daily Intention Banner */}
            <div className="hidden md:flex items-center gap-2">
              {isEditingIntention ? (
                <input
                  type="text"
                  value={intention}
                  autoFocus
                  onChange={e => setIntention(e.target.value)}
                  onBlur={() => { storage.set('flow_daily_intention', intention); setIsEditingIntention(false); }}
                  onKeyDown={e => { if (e.key === 'Enter') { storage.set('flow_daily_intention', intention); setIsEditingIntention(false); }}}
                  className="bg-black/60 border border-white/20 rounded-full px-4 py-1 text-xs text-white focus:outline-none"
                />
              ) : (
                <div 
                  onClick={() => setIsEditingIntention(true)}
                  className="text-xs font-mono text-gray-400 hover:text-white cursor-pointer px-4 py-1 rounded-full bg-white/5 border border-white/5"
                  title="Click to edit daily objective"
                >
                  🎯 {intention}
                </div>
              )}
            </div>

            {/* Top Action Tools */}
            <div className="flex items-center gap-2">
              {/* Timer Mode Selection */}
              <div className="flex bg-white/5 p-1 rounded-full border border-white/5 mr-2">
                {['pomodoro', 'flowtime', 'stopwatch'].map(m => (
                  <button
                    key={m}
                    onClick={() => timer.setMode(m)}
                    className={`px-3 py-1 rounded-full text-[10px] font-mono uppercase font-bold transition-all ${
                      timer.mode === m ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
                    }`}
                  >
                    {m}
                  </button>
                ))}
              </div>

              <button
                onClick={toggleFullscreen}
                title="Toggle Fullscreen"
                className="p-2.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10"
              >
                <Icons.Expand />
              </button>

              <button
                onClick={() => setIsZenMode(!isZenMode)}
                title="Zen Focus (Z)"
                className="p-2.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10"
              >
                <Icons.Zen />
              </button>
            </div>
          </header>

          {/* MAIN COMMAND INTERFACE */}
          <main className="flex-1 flex flex-col items-center justify-center px-4 relative z-10 my-auto">
            
            {/* Active Target Banner */}
            {taskManager.activeTask && (
              <div className={`mb-4 transition-all duration-500 ${isZenMode ? 'opacity-30' : 'opacity-100'}`}>
                <div 
                  onClick={() => setDrawerOpen('tasks')}
                  className="glass px-5 py-2 rounded-full flex items-center gap-3 cursor-pointer hover:border-white/30 transition-all border border-white/10 shadow-xl"
                >
                  <span className="w-2 h-2 rounded-full animate-ping" style={{ backgroundColor: timer.settings.accentColor }} />
                  <span className="text-xs font-semibold text-gray-200 truncate max-w-[200px] sm:max-w-xs">
                    {taskManager.activeTask.title}
                  </span>
                  <span className="text-xs font-mono text-gray-400">
                    🍅 {taskManager.activeTask.act}/{taskManager.activeTask.est}
                  </span>
                </div>
              </div>
            )}

            {/* Presets Bar */}
            {timer.mode === 'pomodoro' && (
              <div className={`flex items-center gap-1.5 mb-6 transition-all duration-500 ${isZenMode ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                {[
                  { label: '25/5', focus: 25, rest: 5 },
                  { label: '50/10', focus: 50, rest: 10 },
                  { label: '90/20', focus: 90, rest: 20 }
                ].map(p => (
                  <button
                    key={p.label}
                    onClick={() => timer.applyPreset(p.focus, p.rest, p.label)}
                    className={`px-3 py-1 rounded-full text-xs font-mono font-medium border ${
                      timer.settings.preset === p.label 
                        ? 'border-blue-500/50 bg-blue-500/10 text-white' 
                        : 'border-white/5 text-gray-400 hover:text-white bg-white/5'
                    }`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            )}

            {/* SVG Timer HUD */}
            <TimerRing
              time={timer.time}
              duration={timer.duration}
              isRunning={timer.isRunning}
              phase={timer.phase}
              accentColor={timer.settings.accentColor}
              onToggle={timer.toggle}
              onAdjust={timer.adjustTime}
            />

            {/* Main Play/Pause Controls */}
            <div className={`mt-8 flex items-center gap-4 transition-all duration-500 ${
              isZenMode ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100 scale-100'
            }`}>
              <button
                onClick={timer.reset}
                title="Reset Interval"
                className="p-3.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 active:scale-95 border border-white/5"
              >
                <Icons.Reset />
              </button>

              <button
                onClick={timer.toggle}
                className="px-8 py-4 rounded-full text-black font-bold uppercase tracking-widest text-sm flex items-center gap-3 shadow-2xl transition-all duration-200 active:scale-95"
                style={{
                  backgroundColor: timer.isRunning ? '#ffffff' : timer.settings.accentColor,
                  boxShadow: `0 0 35px ${timer.settings.accentColor}40`
                }}
              >
                {timer.isRunning ? <Icons.Pause /> : <Icons.Play />}
                <span>{timer.isRunning ? 'Pause' : 'Engage'}</span>
              </button>

              <button
                onClick={timer.skip}
                title="Skip to Next"
                className="p-3.5 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 active:scale-95 border border-white/5"
              >
                <Icons.Skip />
              </button>
            </div>
          </main>

          {/* DOCK BAR */}
          <nav className={`fixed bottom-5 left-1/2 -translate-x-1/2 glass px-3 py-2 rounded-full flex items-center gap-1 sm:gap-2 shadow-2xl z-30 transition-all duration-500 ${
            isZenMode ? 'opacity-0 translate-y-10 pointer-events-none' : 'opacity-100 translate-y-0'
          }`}>
            <button
              onClick={() => setDrawerOpen('tasks')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'tasks' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              <Icons.Tasks />
              <span className="hidden sm:inline">Tasks</span>
              {taskManager.tasks.filter(t => !t.completed).length > 0 && (
                <span className="w-5 h-5 rounded-full bg-blue-500 text-black font-mono text-[10px] flex items-center justify-center font-bold">
                  {taskManager.tasks.filter(t => !t.completed).length}
                </span>
              )}
            </button>

            <button
              onClick={() => setDrawerOpen('audio')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'audio' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              <Icons.Music />
              <span className="hidden sm:inline">Music & Sound</span>
              {musicPlayer.isPlaying && <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />}
            </button>

            <button
              onClick={() => setDrawerOpen('settings')}
              className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawerOpen === 'settings' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              <Icons.Settings />
              <span className="hidden sm:inline">Settings</span>
            </button>
          </nav>

          {/* DRAWERS */}
          <Drawer isOpen={drawerOpen === 'tasks'} onClose={() => setDrawerOpen(null)} title="Task Database & Objectives">
            <TasksContent taskManager={taskManager} accentColor={timer.settings.accentColor} />
          </Drawer>

          <Drawer isOpen={drawerOpen === 'audio'} onClose={() => setDrawerOpen(null)} title="Audio Studio & Ambience Vault">
            <MusicContent musicPlayer={musicPlayer} accentColor={timer.settings.accentColor} />
          </Drawer>

          <Drawer isOpen={drawerOpen === 'settings'} onClose={() => setDrawerOpen(null)} title="System Parameters & Vault Backup">
            <SettingsContent timer={timer} setSettings={timer.setSettings} />
          </Drawer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
