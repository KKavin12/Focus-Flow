<body class="selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- LOCAL STORAGE ENGINE ---
    const storage = {
      get: (k, d) => {
        try {
          const item = window.localStorage.getItem(k);
          return item ? JSON.parse(item) : d;
        } catch (e) {
          return d;
        }
      },
      set: (k, v) => {
        try {
          window.localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      }
    };

    // --- INDEXEDDB AUDIO VAULT ENGINE ---
    const idb = {
      db: null,
      async init() {
        if (this.db) return this.db;
        return new Promise((res, rej) => {
          const req = indexedDB.open('flow_master_vault_v8', 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('tracks')) {
              db.createObjectStore('tracks', { keyPath: 'id' });
            }
          };
          req.onsuccess = e => { this.db = e.target.result; res(this.db); };
          req.onerror = () => rej();
        });
      },
      async saveTrack(track) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').put(track);
          tx.oncomplete = () => res();
        });
      },
      async getAllTracks() {
        try {
          const db = await this.init();
          return new Promise(res => {
            const tx = db.transaction('tracks', 'readonly');
            const r = tx.objectStore('tracks').getAll();
            r.onsuccess = () => res(r.result || []);
          });
        } catch(e) { return []; }
      },
      async deleteTrack(id) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').delete(id);
          tx.oncomplete = () => res();
        });
      },
      async clearTracks() {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').clear();
          tx.oncomplete = () => res();
        });
      }
    };

    // --- SOUND ENGINE (CHIMES, ALARMS, AMBIENCE & PROCEDURAL SYNTH) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.nodes = {};
        this.alarmInterval = null;
        this.isAlarming = false;
        this.lofiTimer = null;
        this.isLofiPlaying = false;
      }
      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
      }
      
      // Repeating Authentic Windows Clock Chime Loop
      startAlarmLoop() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.stopAlarmLoop();
        this.isAlarming = true;

        const ring = () => {
          if (!this.isAlarming || !this.ctx) return;
          const now = this.ctx.currentTime;
          
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // E5
          gain1.gain.setValueAtTime(0.35, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1).connect(this.masterGain);
          osc1.start(now);
          osc1.stop(now + 0.35);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.16); // A5
          gain2.gain.setValueAtTime(0.42, now + 0.16);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc2.connect(gain2).connect(this.masterGain);
          osc2.start(now + 0.16);
          osc2.stop(now + 0.7);
        };

        ring();
        this.alarmInterval = setInterval(ring, 1700);
      }

      stopAlarmLoop() {
        this.isAlarming = false;
        if (this.alarmInterval) {
          clearInterval(this.alarmInterval);
          this.alarmInterval = null;
        }
      }

      // Time Limit Warning Chime (Triple Tone)
      playLimitAlertTone() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;

        const tones = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        tones.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.28, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
          osc.connect(gain).connect(this.masterGain);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.4);
        });
      }

      playTone(sound = 'bell') {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (sound === 'digital') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
          osc.start(now); osc.stop(now + 1.8);
        }
      }

      // Ambient Synthesizers
      startAmbience(type, volume = 0.5) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.nodes[type]) {
          this.setAmbienceVolume(type, volume);
          return;
        }
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(volume, this.ctx.currentTime);
        g.connect(this.masterGain);

        if (type === 'brown') {
          const sz = 2 * this.ctx.sampleRate;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          let l = 0.0;
          for (let i = 0; i < sz; i++) {
            const w = Math.random() * 2 - 1;
            d[i] = (l + 0.02 * w) / 1.02;
            l = d[i];
            d[i] *= 3.5;
          }
          const s = this.ctx.createBufferSource();
          s.buffer = b; s.loop = true;
          s.connect(g); s.start();
          this.nodes.brown = { src: s, gain: g };
        } else if (type === 'rain') {
          const sz = 2 * this.ctx.sampleRate;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
          const s = this.ctx.createBufferSource();
          s.buffer = b; s.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.7;
          s.connect(f).connect(g); s.start();
          this.nodes.rain = { src: s, gain: g };
        } else if (type === 'hum') {
          const o = this.ctx.createOscillator();
          o.type = 'sine'; o.frequency.value = 55;
          o.connect(g); o.start();
          this.nodes.hum = { src: o, gain: g };
        } else if (type === 'binaural') {
          const oscL = this.ctx.createOscillator();
          const oscR = this.ctx.createOscillator();
          oscL.type = 'sine'; oscL.frequency.value = 200;
          oscR.type = 'sine'; oscR.frequency.value = 214;
          const merger = this.ctx.createChannelMerger(2);
          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(g);
          oscL.start(); oscR.start();
          this.nodes.binaural = { src: [oscL, oscR], gain: g };
        } else if (type === 'alpha') {
          const oscL = this.ctx.createOscillator();
          const oscR = this.ctx.createOscillator();
          oscL.type = 'sine'; oscL.frequency.value = 150;
          oscR.type = 'sine'; oscR.frequency.value = 160;
          const merger = this.ctx.createChannelMerger(2);
          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(g);
          oscL.start(); oscR.start();
          this.nodes.alpha = { src: [oscL, oscR], gain: g };
        } else if (type === 'vinyl') {
          const sz = 2 * this.ctx.sampleRate;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) {
            const crackle = Math.random() > 0.998 ? (Math.random() * 2 - 1) * 0.8 : 0;
            d[i] = crackle + (Math.random() * 2 - 1) * 0.015;
          }
          const s = this.ctx.createBufferSource();
          s.buffer = b; s.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'highpass'; f.frequency.value = 1400;
          s.connect(f).connect(g); s.start();
          this.nodes.vinyl = { src: s, gain: g };
        }
      }

      setAmbienceVolume(type, vol) {
        if (this.nodes[type] && this.ctx) {
          this.nodes[type].gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.05);
        }
      }

      stopAmbience(type) {
        if (this.nodes[type]) {
          try { 
            if (Array.isArray(this.nodes[type].src)) this.nodes[type].src.forEach(s => s.stop());
            else this.nodes[type].src.stop(); 
          } catch(e) {}
          delete this.nodes[type];
        }
      }

      stopAllAmbience() {
        Object.keys(this.nodes).forEach(k => this.stopAmbience(k));
      }

      // Procedural Lo-Fi Chords Generator (Warm Electric Piano + Filter)
      startProceduralLoFi(volume = 0.5) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.stopProceduralLoFi();
        this.isLofiPlaying = true;

        const chordProgressions = [
          [293.66, 349.23, 440.00, 523.25], // Dm7
          [261.63, 329.63, 392.00, 493.88], // Cmaj7
          [220.00, 261.63, 329.63, 392.00], // Am7
          [349.23, 440.00, 523.25, 659.25]  // Fmaj7
        ];
        let chordIdx = 0;

        const playChord = () => {
          if (!this.isLofiPlaying || !this.ctx) return;
          const now = this.ctx.currentTime;
          const freqs = chordProgressions[chordIdx];
          chordIdx = (chordIdx + 1) % chordProgressions.length;

          const chordGain = this.ctx.createGain();
          chordGain.gain.setValueAtTime(0.001, now);
          chordGain.gain.linearRampToValueAtTime(volume * 0.18, now + 0.4);
          chordGain.gain.exponentialRampToValueAtTime(0.001, now + 3.8);

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(750, now);
          filter.Q.value = 1.2;

          freqs.forEach(freq => {
            const osc = this.ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.detune.setValueAtTime((Math.random() * 8) - 4, now);
            osc.connect(filter);
            osc.start(now);
            osc.stop(now + 3.9);
          });

          filter.connect(chordGain).connect(this.masterGain);
        };

        this.startAmbience('vinyl', volume * 0.35);

        playChord();
        this.lofiTimer = setInterval(playChord, 4000);
      }

      stopProceduralLoFi() {
        this.isLofiPlaying = false;
        if (this.lofiTimer) {
          clearInterval(this.lofiTimer);
          this.lofiTimer = null;
        }
        this.stopAmbience('vinyl');
      }
    }
    const soundEngine = new SoundEngine();

    // --- DESKTOP NOTIFICATIONS & SCREEN WAKE LOCK ---
    const notifier = {
      async request() {
        if ('Notification' in window && Notification.permission !== 'granted') {
          await Notification.requestPermission();
        }
      },
      dispatch(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body,
              requireInteraction: true,
              icon: 'https://cdn-icons-png.flaticon.com/512/850/850960.png'
            });
          } catch(e) {}
        }
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
      }
    };

    let wakeLockSentinel = null;
    const wakeLock = {
      async request() {
        try {
          if ('wakeLock' in navigator) wakeLockSentinel = await navigator.wakeLock.request('screen');
        } catch(e) {}
      },
      release() {
        if (wakeLockSentinel) {
          wakeLockSentinel.release().catch(()=>{});
          wakeLockSentinel = null;
        }
      }
    };

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function formatMinutesHuman(totalMinutes) {
      const m = Math.floor(Math.max(0, totalMinutes));
      const hrs = Math.floor(m / 60);
      const rem = m % 60;
      if (hrs > 0) {
        return `${hrs}h ${rem.toString().padStart(2, '0')}m`;
      }
      return `${rem}m`;
    }

    // Convert 24-hour 'HH:MM' to friendly 'H:MM AM/PM'
    function format12Hour(time24) {
      if (!time24 || typeof time24 !== 'string') return '';
      const parts = time24.split(':');
      if (parts.length < 2) return time24;
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const period = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${h12}:${m.toString().padStart(2, '0')} ${period}`;
    }

    // --- DEFAULT TIME BUDGETS (ACTIVITY CAPS WITH 30-15 BREAKS) ---
    const DEFAULT_TIME_BUDGETS = [
      {
        id: 'budget_tv_phone',
        title: 'Watching TV / Phone',
        category: 'entertainment',
        icon: '📺',
        maxMinutes: 180, // Requested: 3 hours max daily limit
        sessionMins: 30, // Requested: 30-min activity interval
        breakMins: 15,   // Requested: 15-min break interval
        color: '#f43f5e',
        description: 'Screen leisure: 30m watch / 15m break cycle with a 3-hour daily cap.'
      },
      {

        icon: '🎮',

        sessionMins: 45, // 45m interval
        breakMins: 15,   // 15m break
        color: '#8b5cf6',

      },
      {

        title: 'Casual Browsing',
        category: 'leisure',
        icon: '🌐',
        maxMinutes: 60,  // 1 hour max limit
        sessionMins: 30, // 30m interval
        breakMins: 15,   // 15m break
        color: '#06b6d4',
        description: 'Aimless news and forums: 30m browsing / 15m break cycle.'
      }
    ];

    // --- HOOK: TIME BUDGETS & ACTIVITY CAP MANAGER ---
    function useBudgetManager(onLimitExceeded) {
      const [budgets, setBudgets] = useState(() => storage.get('flow_budgets_v8', DEFAULT_TIME_BUDGETS));
      useEffect(() => { storage.set('flow_budgets_v8', budgets); }, [budgets]);

      const [usageMap, setUsageMap] = useState(() => storage.get('flow_budget_usage_v8', {}));
      useEffect(() => { storage.set('flow_budget_usage_v8', usageMap); }, [usageMap]);

      const [activeBudgetId, setActiveBudgetId] = useState('budget_tv_phone');
      const alertedTodayRef = useRef({});

      const todayKey = new Date().toDateString();

      const getUsage = useCallback((budgetId) => {
        return usageMap[todayKey]?.[budgetId] || 0;
      }, [usageMap, todayKey]);

      const logMinutes = useCallback((budgetId, deltaMins) => {
        if (!budgetId || deltaMins === 0) return;

        setUsageMap(prev => {
          const currentDayMap = prev[todayKey] || {};
          const currentVal = currentDayMap[budgetId] || 0;
          const nextVal = Math.max(0, currentVal + deltaMins);
          const newMap = {
            ...prev,
            [todayKey]: {
              ...currentDayMap,
              [budgetId]: nextVal
            }
          };

          const budget = budgets.find(b => b.id === budgetId);
          if (budget) {
            const alerted = alertedTodayRef.current[budgetId] || {};
            if (nextVal >= budget.maxMinutes && !alerted['100']) {
              alerted['100'] = true;
              alertedTodayRef.current[budgetId] = alerted;
              if (onLimitExceeded) {
                onLimitExceeded({
                  budget,
                  currentMinutes: nextVal,
                  isExceeded: true,
                  percentage: Math.round((nextVal / budget.maxMinutes) * 100)
                });
              }
            } else if (nextVal >= budget.maxMinutes * 0.85 && nextVal < budget.maxMinutes && !alerted['85']) {
              alerted['85'] = true;
              alertedTodayRef.current[budgetId] = alerted;
              if (onLimitExceeded) {
                onLimitExceeded({
                  budget,
                  currentMinutes: nextVal,
                  isExceeded: false,
                  percentage: Math.round((nextVal / budget.maxMinutes) * 100)
                });
              }
            }
          }

          return newMap;
        });
      }, [budgets, todayKey, onLimitExceeded]);

      const updateBudgetConfig = useCallback((budgetId, updates) => {
        setBudgets(prev => prev.map(b => b.id === budgetId ? { ...b, ...updates } : b));
      }, []);

      const resetToday = useCallback((budgetId) => {
        setUsageMap(prev => {
          const currentDayMap = { ...(prev[todayKey] || {}) };
          delete currentDayMap[budgetId];
          return { ...prev, [todayKey]: currentDayMap };
        });
        if (alertedTodayRef.current[budgetId]) {
          delete alertedTodayRef.current[budgetId];
        }
      }, [todayKey]);

      const addBudget = useCallback((newBudget) => {
        const item = {
          id: 'budget_' + Date.now().toString(36),
          title: newBudget.title.trim(),
          category: newBudget.category || 'entertainment',
          icon: newBudget.icon || '⏱️',
          maxMinutes: Math.max(5, parseInt(newBudget.maxMinutes) || 180),
          sessionMins: Math.max(5, parseInt(newBudget.sessionMins) || 30),
          breakMins: Math.max(1, parseInt(newBudget.breakMins) || 15),
          color: newBudget.color || '#3b82f6',
          description: newBudget.description || 'Custom activity daily cap'
        };
        setBudgets(prev => [...prev, item]);
      }, []);

      const deleteBudget = useCallback((budgetId) => {
        setBudgets(prev => prev.filter(b => b.id !== budgetId));
        if (activeBudgetId === budgetId) setActiveBudgetId(null);
      }, [activeBudgetId]);

      const activeBudget = useMemo(() => budgets.find(b => b.id === activeBudgetId) || budgets[0] || null, [budgets, activeBudgetId]);

      return {
        budgets,
        activeBudget,
        activeBudgetId,
        setActiveBudgetId,
        getUsage,
        logMinutes,
        updateBudgetConfig,
        resetToday,
        addBudget,
        deleteBudget,
        usageMap,
        todayKey
      };
    }

    // --- HOOK: SCHEDULED CLOCK ALARMS (SET SPECIFIC TIME) ---
    function useAlarmManager(onAlarmTrigger) {
      const [alarms, setAlarms] = useState(() => storage.get('flow_clock_alarms_v1', [
        {
          id: 'alarm_1',
          time: '08:00',
          label: 'Morning Focus Kickoff',
          enabled: true,
          repeat: 'daily'
        },
        {
          id: 'alarm_2',
          time: '14:30',
          label: 'Afternoon Flow Session',
          enabled: false,
          repeat: 'weekdays'
        },
        {
          id: 'alarm_3',
          time: '22:30',
          label: 'Screen Curfew & Bedtime',
          enabled: true,
          repeat: 'daily'
        }
      ]));
      useEffect(() => { storage.set('flow_clock_alarms_v1', alarms); }, [alarms]);

      const lastTriggeredRef = useRef({});

      // Background clock watcher (every 1000ms)
      useEffect(() => {
        const interval = setInterval(() => {
          const now = new Date();
          const hours = now.getHours().toString().padStart(2, '0');
          const mins = now.getMinutes().toString().padStart(2, '0');
          const timeStr = `${hours}:${mins}`;
          const day = now.getDay(); // 0 is Sun, 6 is Sat
          const isWeekend = day === 0 || day === 6;
          const dateKey = now.toDateString() + '_' + timeStr;

          alarms.forEach(alarm => {
            if (!alarm.enabled) return;
            if (alarm.time !== timeStr) return;
            if (lastTriggeredRef.current[alarm.id] === dateKey) return; // Prevent multiple rings in the same minute

            if (alarm.repeat === 'weekdays' && isWeekend) return;
            if (alarm.repeat === 'weekends' && !isWeekend) return;

            // Trigger alarm!
            lastTriggeredRef.current[alarm.id] = dateKey;
            if (alarm.repeat === 'once') {
              setAlarms(prev => prev.map(a => a.id === alarm.id ? { ...a, enabled: false } : a));
            }

            if (onAlarmTrigger) {
              onAlarmTrigger(alarm);
            }
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [alarms, onAlarmTrigger]);

      const toggleAlarm = useCallback((id) => {
        setAlarms(prev => prev.map(a => a.id === id ? { ...a, enabled: !a.enabled } : a));
      }, []);

      const addAlarm = useCallback(({ time, label, repeat = 'daily' }) => {
        const newAlarm = {
          id: 'alarm_' + Date.now().toString(36),
          time: time || '09:00',
          label: (label && label.trim()) || 'Focus Reminder',
          enabled: true,
          repeat
        };
        setAlarms(prev => [...prev, newAlarm]);
      }, []);

      const deleteAlarm = useCallback((id) => {
        setAlarms(prev => prev.filter(a => a.id !== id));
      }, []);

      const snoozeAlarm = useCallback((alarm, snoozeMins = 5) => {
        const now = new Date();
        now.setMinutes(now.getMinutes() + snoozeMins);
        const hours = now.getHours().toString().padStart(2, '0');
        const mins = now.getMinutes().toString().padStart(2, '0');
        const snoozeTime = `${hours}:${mins}`;

        const snoozedAlarm = {
          id: 'snooze_' + Date.now().toString(36),
          time: snoozeTime,
          label: `[Snoozed +${snoozeMins}m] ${alarm.label || 'Alarm'}`,
          enabled: true,
          repeat: 'once'
        };
        setAlarms(prev => [...prev, snoozedAlarm]);
      }, []);

      const addQuickAlarm = useCallback((deltaMinutes, label = 'Quick Alarm') => {
        const now = new Date();
        now.setMinutes(now.getMinutes() + deltaMinutes);
        const hours = now.getHours().toString().padStart(2, '0');
        const mins = now.getMinutes().toString().padStart(2, '0');
        addAlarm({
          time: `${hours}:${mins}`,
          label: `${label} (+${deltaMinutes}m)`,
          repeat: 'once'
        });
      }, [addAlarm]);

      // Calculate the next upcoming alarm
      const nextAlarm = useMemo(() => {
        const enabledAlarms = alarms.filter(a => a.enabled);
        if (enabledAlarms.length === 0) return null;

        const now = new Date();
        const curMinutes = now.getHours() * 60 + now.getMinutes();

        let closest = null;
        let minDiff = Infinity;

        enabledAlarms.forEach(a => {
          const [h, m] = a.time.split(':').map(Number);
          const aMinutes = h * 60 + m;
          let diff = aMinutes - curMinutes;
          if (diff <= 0) diff += 24 * 60; // Next day
          if (diff < minDiff) {
            minDiff = diff;
            closest = { ...a, diffMinutes: diff };
          }
        });

        return closest;
      }, [alarms]);

      return {
        alarms,
        toggleAlarm,
        addAlarm,
        deleteAlarm,
        snoozeAlarm,
        addQuickAlarm,
        nextAlarm
      };
    }

    // --- HOOK: FULLY POLISHED MUSIC PLAYER ENGINE ---
    function useMusicPlayer(isBreak) {
      const [playlist, setPlaylist] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isLoFiActive, setIsLoFiActive] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(() => storage.get('flow_music_vol', 0.8));
      const [repeatMode, setRepeatMode] = useState(() => storage.get('flow_music_repeat', 'all'));
      const [isShuffle, setIsShuffle] = useState(() => storage.get('flow_music_shuffle', false));
      const [duckOnBreak, setDuckOnBreak] = useState(true);

      const audioRef = useRef(new Audio());
      const currentTrack = playlist[currentIndex] || null;

      useEffect(() => { storage.set('flow_music_vol', volume); }, [volume]);
      useEffect(() => { storage.set('flow_music_repeat', repeatMode); }, [repeatMode]);
      useEffect(() => { storage.set('flow_music_shuffle', isShuffle); }, [isShuffle]);

      useEffect(() => {
        idb.getAllTracks().then(tracks => {
          if (tracks.length > 0) {
            setPlaylist(tracks.map(t => ({ ...t, url: URL.createObjectURL(t.file) })));
          }
        });
      }, []);

      useEffect(() => {
        const a = audioRef.current;
        const onTime = () => setCurrentTime(a.currentTime);
        const onMeta = () => setDuration(a.duration || 0);
        const onEnd = () => {
          if (repeatMode === 'one') {
            a.currentTime = 0;
            a.play().catch(()=>{});
          } else if (repeatMode === 'all') {
            handleNext();
          } else {
            if (currentIndex < playlist.length - 1) handleNext();
            else setIsPlaying(false);
          }
        };
        a.addEventListener('timeupdate', onTime);
        a.addEventListener('loadedmetadata', onMeta);
        a.addEventListener('ended', onEnd);
        return () => {
          a.removeEventListener('timeupdate', onTime);
          a.removeEventListener('loadedmetadata', onMeta);
          a.removeEventListener('ended', onEnd);
        };
      }, [currentIndex, playlist.length, repeatMode]);

      useEffect(() => {
        const effVol = isBreak && duckOnBreak ? volume * 0.25 : volume;
        audioRef.current.volume = effVol;
      }, [volume, isBreak, duckOnBreak]);

      const playIndex = (idx) => {
        if (!playlist[idx]) return;
        if (isLoFiActive) {
          soundEngine.stopProceduralLoFi();
          setIsLoFiActive(false);
        }
        setCurrentIndex(idx);
        audioRef.current.src = playlist[idx].url;
        audioRef.current.play().then(() => setIsPlaying(true)).catch(()=>{});
      };

      const togglePlay = () => {
        if (isLoFiActive) {
          soundEngine.stopProceduralLoFi();
          setIsLoFiActive(false);
          setIsPlaying(false);
          return;
        }

        if (!currentTrack) {
          if (playlist.length > 0) return playIndex(0);
          startLoFiRadio();
          return;
        }

        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => setIsPlaying(true)).catch(()=>{});
        }
      };

      const handleNext = () => {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (isShuffle) {
          nextIndex = Math.floor(Math.random() * playlist.length);
        } else if (nextIndex >= playlist.length) {
          nextIndex = 0;
        }
        playIndex(nextIndex);
      };

      const handlePrev = () => {
        if (playlist.length === 0) return;
        if (audioRef.current.currentTime > 3) {
          audioRef.current.currentTime = 0;
          return;
        }
        const prevIndex = currentIndex - 1 < 0 ? playlist.length - 1 : currentIndex - 1;
        playIndex(prevIndex);
      };

      const skip = (secs) => {
        if (!audioRef.current) return;
        audioRef.current.currentTime = Math.max(0, Math.min(duration, audioRef.current.currentTime + secs));
      };

      const addTracks = async (files) => {
        const newTracks = [];
        for (const f of Array.from(files).filter(x => x.type.startsWith('audio/'))) {
          const item = {
            id: Date.now() + '-' + Math.random().toString(36).substring(2, 7),
            name: f.name.replace(/\.[^/.]+$/, ""),
            size: (f.size / (1024 * 1024)).toFixed(1) + ' MB',
            file: f
          };
          await idb.saveTrack(item);
          item.url = URL.createObjectURL(f);
          newTracks.push(item);
        }
        setPlaylist(p => [...p, ...newTracks]);
      };

      const removeTrack = async (id) => {
        await idb.deleteTrack(id);
        setPlaylist(p => {
          const filtered = p.filter(t => t.id !== id);
          if (currentTrack?.id === id) {
            audioRef.current.pause();
            setIsPlaying(false);
          }
          return filtered;
        });
      };

      const clearAllTracks = async () => {
        audioRef.current.pause();
        setIsPlaying(false);
        await idb.clearTracks();
        setPlaylist([]);
        setCurrentIndex(0);
      };

      const startLoFiRadio = () => {
        audioRef.current.pause();
        soundEngine.startProceduralLoFi(volume);
        setIsLoFiActive(true);
        setIsPlaying(true);
      };

      const stopLoFiRadio = () => {
        soundEngine.stopProceduralLoFi();
        setIsLoFiActive(false);
        setIsPlaying(false);
      };

      return {
        playlist,
        currentTrack: isLoFiActive ? { name: 'Procedural Lo-Fi Radio (Vinyl & Chords)', size: 'Live Synth' } : currentTrack,
        isPlaying,
        isLoFiActive,
        currentTime: isLoFiActive ? 0 : currentTime,
        duration: isLoFiActive ? 0 : duration,
        volume,
        setVolume,
        repeatMode,
        setRepeatMode,
        isShuffle,
        setIsShuffle,
        duckOnBreak,
        setDuckOnBreak,
        togglePlay,
        handleNext,
        handlePrev,
        skip,
        addTracks,
        removeTrack,
        clearAllTracks,
        playIndex,
        startLoFiRadio,
        stopLoFiRadio,
        seek: (t) => { audioRef.current.currentTime = t; setCurrentTime(t); }
      };
    }

    // --- HOOK: TIMER SYSTEM ---
    function useTimer(onAlarmTrigger, onBudgetTick, activeBudget) {
      const [settings, setSettings] = useState(() => storage.get('flow_settings_v8', {
        pomodoroFocus: 25,
        pomodoroShort: 5,
        pomodoroLong: 15,
        budgetSession: 30,
        budgetBreak: 15,
        budgetPreset: '30/15',
        autoStart: false,
        accentColor: '#3b82f6',
        preset: '25/5'
      }));
      useEffect(() => { storage.set('flow_settings_v8', settings); }, [settings]);

      const [stats, setStats] = useState(() => storage.get('flow_stats_v8', {
        history: {}, todayMinutes: 0, streak: 1, totalSessions: 0
      }));
      useEffect(() => { storage.set('flow_stats_v8', stats); }, [stats]);

      const [mode, setMode] = useState('pomodoro');
      const [phase, setPhase] = useState('focus');
      const [isRunning, setIsRunning] = useState(false);
      const [time, setTime] = useState(settings.pomodoroFocus * 60);
      const [duration, setDuration] = useState(settings.pomodoroFocus * 60);
      const [sessionCount, setSessionCount] = useState(0);

      const targetRef = useRef(0);
      const countUpRef = useRef(0);
      const lastTickRef = useRef(Date.now());
      const accumulatedFocusSecsRef = useRef(0);
      const accumulatedBudgetSecsRef = useRef(0);

      const handleComplete = useCallback(() => {
        setIsRunning(false);

        if (mode === 'cap_tracker') {
          const actMins = activeBudget?.sessionMins || settings.budgetSession || 30;
          const brkMins = activeBudget?.breakMins || settings.budgetBreak || 15;

          if (phase === 'activity') {
            const nextPh = 'break';
            const title = "Activity Session Finished ☕";
            const msg = `You completed a ${actMins}-min session of ${activeBudget?.title || 'leisure'}. Time for a ${brkMins}-min break to rest your eyes and stretch!`;

            soundEngine.startAlarmLoop();
            notifier.dispatch(`⏰ ${title} - FLOW Guard`, msg);

            onAlarmTrigger({
              type: 'cap_session',
              title,
              message: msg,
              phase: 'activity',
              nextPhase: nextPh,
              sessionMins: actMins,
              breakMins: brkMins,
              budget: activeBudget
            });
          } else {
            const nextPh = 'activity';
            const title = "Break Finished 📺";
            const msg = `Your ${brkMins}-min break is over. Ready for your next ${actMins}-min session or switch to focus?`;

            soundEngine.startAlarmLoop();
            notifier.dispatch(`⏰ ${title} - FLOW Guard`, msg);

            onAlarmTrigger({
              type: 'cap_session',
              title,
              message: msg,
              phase: 'break',
              nextPhase: nextPh,
              sessionMins: actMins,
              breakMins: brkMins,
              budget: activeBudget
            });
          }
          return;
        }

        let nextPh = 'shortBreak';
        let title = "Time's up!";
        let msg = "Your focus session is finished.";

        if (phase === 'focus') {
          const nextCount = sessionCount + 1;
          setSessionCount(nextCount);
          setStats(s => ({ ...s, totalSessions: (s.totalSessions || 0) + 1 }));
          const isLong = nextCount % 4 === 0;
          nextPh = isLong ? 'longBreak' : 'shortBreak';
          title = "Focus Session Finished";
          msg = isLong ? "Great progress! Time for an extended break." : "Take 5 minutes to relax and stretch.";
        } else {
          nextPh = 'focus';
          title = "Break Finished";
          msg = "Ready to engage in your next focus sprint?";
        }

        soundEngine.startAlarmLoop();
        notifier.dispatch(`⏰ ${title} - FLOW Command`, msg);

        onAlarmTrigger({
          type: 'timer',
          title,
          message: msg,
          phase,
          nextPhase: nextPh
        });
      }, [mode, phase, sessionCount, settings, activeBudget, onAlarmTrigger, setStats]);

      useEffect(() => {
        if (!isRunning) {
          wakeLock.release();
          return;
        }
        wakeLock.request();
        lastTickRef.current = Date.now();

        const interval = setInterval(() => {
          const now = Date.now();
          const deltaSecs = Math.max(0, (now - lastTickRef.current) / 1000);
          lastTickRef.current = now;

          if (mode === 'stopwatch' || (mode === 'flowtime' && phase === 'focus')) {
            const elapsed = Math.floor((now - countUpRef.current) / 1000);
            setTime(elapsed);

            if (mode === 'flowtime' && phase === 'focus') {
              accumulatedFocusSecsRef.current += deltaSecs;
              if (accumulatedFocusSecsRef.current >= 60) {
                accumulatedFocusSecsRef.current -= 60;
                const today = new Date().toDateString();
                setStats(s => {
                  const todayMins = (s.history[today] || 0) + 1;
                  return {
                    ...s,
                    history: { ...s.history, [today]: todayMins },
                    todayMinutes: todayMins
                  };
                });
              }
            }
            return;
          }

          const rem = Math.max(0, Math.ceil((targetRef.current - now) / 1000));
          setTime(rem);

          if (mode === 'cap_tracker' && phase === 'activity' && onBudgetTick) {
            accumulatedBudgetSecsRef.current += deltaSecs;
            if (accumulatedBudgetSecsRef.current >= 60) {
              const wholeMinutes = Math.floor(accumulatedBudgetSecsRef.current / 60);
              accumulatedBudgetSecsRef.current -= wholeMinutes * 60;
              onBudgetTick(wholeMinutes);
            }
          }

          if (mode === 'pomodoro' && phase === 'focus') {
            accumulatedFocusSecsRef.current += deltaSecs;
            if (accumulatedFocusSecsRef.current >= 60) {
              accumulatedFocusSecsRef.current -= 60;
              const today = new Date().toDateString();
              setStats(s => {
                const todayMins = (s.history[today] || 0) + 1;
                return {
                  ...s,
                  history: { ...s.history, [today]: todayMins },
                  todayMinutes: todayMins
                };
              });
            }
          }

          if (rem <= 0) handleComplete();
        }, 250);

        return () => clearInterval(interval);
      }, [isRunning, mode, phase, handleComplete, setStats, onBudgetTick]);

      const toggle = () => {
        notifier.request();
        if (isRunning) {
          setIsRunning(false);
        } else {
          lastTickRef.current = Date.now();
          if (mode === 'stopwatch' || (mode === 'flowtime' && phase === 'focus')) {
            countUpRef.current = Date.now() - (time * 1000);
          } else {
            targetRef.current = Date.now() + (time * 1000);
          }
          setIsRunning(true);
        }
      };

      const reset = () => {
        setIsRunning(false);
        if (mode === 'stopwatch') {
          setTime(0);
          setDuration(0);
          countUpRef.current = Date.now();
        } else if (mode === 'cap_tracker') {
          const actMins = activeBudget?.sessionMins || settings.budgetSession || 30;
          const brkMins = activeBudget?.breakMins || settings.budgetBreak || 15;
          const s = (phase === 'activity' ? actMins : brkMins) * 60;
          setTime(s);
          setDuration(s);
        } else {
          const s = (phase === 'focus' ? settings.pomodoroFocus : phase === 'shortBreak' ? settings.pomodoroShort : settings.pomodoroLong) * 60;
          setTime(s);
          setDuration(s);
        }
      };

      const adjustTime = (deltaMins) => {
        const secs = deltaMins * 60;
        const newTime = Math.max(10, time + secs);
        setTime(newTime);
        setDuration(d => Math.max(newTime, d + secs));
        if (isRunning) targetRef.current += secs * 1000;
      };

      const startNextPhase = (nextPh) => {
        setPhase(nextPh);
        let sSecs;
        if (mode === 'cap_tracker') {
          const actMins = activeBudget?.sessionMins || settings.budgetSession || 30;
          const brkMins = activeBudget?.breakMins || settings.budgetBreak || 15;
          sSecs = (nextPh === 'activity' ? actMins : brkMins) * 60;
        } else {
          sSecs = (nextPh === 'focus' ? settings.pomodoroFocus : nextPh === 'shortBreak' ? settings.pomodoroShort : settings.pomodoroLong) * 60;
        }
        setTime(sSecs);
        setDuration(sSecs);
        targetRef.current = Date.now() + sSecs * 1000;
        lastTickRef.current = Date.now();
        setIsRunning(true);
      };

      const switchMode = (newMode, budgetItem = null) => {
        setIsRunning(false);
        setMode(newMode);
        if (newMode === 'stopwatch') {
          setTime(0);
          setDuration(0);
          countUpRef.current = Date.now();
        } else if (newMode === 'cap_tracker') {
          setPhase('activity');
          const targetBudget = budgetItem || activeBudget;
          const sMins = targetBudget?.sessionMins || settings.budgetSession || 30;
          const sSecs = sMins * 60;
          setTime(sSecs);
          setDuration(sSecs);
        } else {
          setPhase('focus');
          const s = settings.pomodoroFocus * 60;
          setTime(s);
          setDuration(s);
        }
      };

      const applyBudgetPreset = (sessionMins, breakMins, label) => {
        setIsRunning(false);
        setSettings(s => ({
          ...s,
          budgetSession: sessionMins,
          budgetBreak: breakMins,
          budgetPreset: label
        }));
        setPhase('activity');
        const sSecs = sessionMins * 60;
        setTime(sSecs);
        setDuration(sSecs);
      };

      return {
        time, duration, phase, mode, sessionCount, isRunning,
        settings, setSettings, stats, setStats, toggle, reset, adjustTime,
        applyPreset: (f, r, p) => {
          setIsRunning(false);
          setSettings(s => ({ ...s, pomodoroFocus: f, pomodoroShort: r, preset: p }));
          setPhase('focus');
          setDuration(f * 60);
          setTime(f * 60);
        },
        applyBudgetPreset,
        setMode: switchMode,
        startNextPhase
      };
    }

          type: 'budget',
          budgetId: 'budget_tv_phone',
          subtasks: [] 
        }
      ]));
      useEffect(() => { storage.set('flow_tasks_v8', tasks); }, [tasks]);

      const [activeId, setActiveId] = useState(() => storage.get('flow_active_task_id_v8', '1'));
      useEffect(() => { storage.set('flow_active_task_id_v8', activeId); }, [activeId]);

      const activeTask = useMemo(() => tasks.find(t => t.id === activeId) || null, [tasks, activeId]);

      return {
        tasks, activeTask, activeId, setActiveId,
        addTask: (title, tag = 'work', est = 2, type = 'focus', budgetId = null) => {
          if (!title.trim()) return;
          const nt = {
            id: Date.now().toString(),
            title: title.trim(),
            completed: false,
            est: Number(est) || 1,
            act: 0,
            tag,
            type,
            budgetId,
            subtasks: []
          };
          setTasks(p => [nt, ...p]);
          if (!activeId) setActiveId(nt.id);
        },
        toggleTask: (id) => setTasks(p => p.map(t => {
          if (t.id === id) {
            const next = !t.completed;
            if (next && activeId === id) setActiveId(null);
            return { ...t, completed: next };
          }
          return t;
        })),
        deleteTask: (id) => {
          setTasks(p => p.filter(t => t.id !== id));
          if (activeId === id) setActiveId(null);
        },
        incrementAct: (id) => setTasks(p => p.map(t => t.id === id ? { ...t, act: t.act + 1 } : t)),
        addSubtask: (id, text) => setTasks(p => p.map(t => t.id === id ? { ...t, subtasks: [...t.subtasks, { id: Date.now().toString(), title: text, completed: false }] } : t)),
        toggleSubtask: (tId, sId) => setTasks(p => p.map(t => t.id === tId ? { ...t, subtasks: t.subtasks.map(s => s.id === sId ? { ...s, completed: !s.completed } : s) } : t)),
        clearCompleted: () => setTasks(p => p.filter(t => !t.completed))
      };
    }
