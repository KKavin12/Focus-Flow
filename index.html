  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- LOCAL STORAGE ENGINE ---
    const storage = {
      get: (k, d) => {
        try {
          const item = window.localStorage.getItem(k);
          return item ? JSON.parse(item) : d;
        } catch (e) {
          return d;
        }
      },
      set: (k, v) => {
        try {
          window.localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      }
    };

    // --- INDEXEDDB AUDIO VAULT ENGINE ---
    const idb = {
      db: null,
      async init() {
        if (this.db) return this.db;
        return new Promise((res, rej) => {
          const req = indexedDB.open('flow_master_vault_v6', 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('tracks')) {
              db.createObjectStore('tracks', { keyPath: 'id' });
            }
          };
          req.onsuccess = e => { this.db = e.target.result; res(this.db); };
          req.onerror = () => rej();
        });
      },
      async saveTrack(track) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').put(track);
          tx.oncomplete = () => res();
        });
      },
      async getAllTracks() {
        try {
          const db = await this.init();
          return new Promise(res => {
            const tx = db.transaction('tracks', 'readonly');
            const r = tx.objectStore('tracks').getAll();
            r.onsuccess = () => res(r.result || []);
          });
        } catch(e) { return []; }
      },
      async deleteTrack(id) {
        const db = await this.init();
        return new Promise(res => {
          const tx = db.transaction('tracks', 'readwrite');
          tx.objectStore('tracks').delete(id);
          tx.oncomplete = () => res();
        });
      }
    };

    // --- SOUND ENGINE (CHIMES, REPEATING ALARM & SYNTHESIS) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.nodes = {};
        this.alarmInterval = null;
        this.isAlarming = false;
      }
      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);
      }
      
      // Repeating Windows Clock Chime Loop
      startAlarmLoop() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        this.stopAlarmLoop();
        this.isAlarming = true;

        const ring = () => {
          if (!this.isAlarming || !this.ctx) return;
          const now = this.ctx.currentTime;
          
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // E5
          gain1.gain.setValueAtTime(0.32, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc1.connect(gain1).connect(this.masterGain);
          osc1.start(now);
          osc1.stop(now + 0.35);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.16); // A5
          gain2.gain.setValueAtTime(0.38, now + 0.16);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc2.connect(gain2).connect(this.masterGain);
          osc2.start(now + 0.16);
          osc2.stop(now + 0.7);
        };

        ring();
        this.alarmInterval = setInterval(ring, 1700);
      }

      stopAlarmLoop() {
        this.isAlarming = false;
        if (this.alarmInterval) {
          clearInterval(this.alarmInterval);
          this.alarmInterval = null;
        }
      }

      // Time Limit Warning Chime (Triple Tone)
      playLimitAlertTone() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;

        const tones = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        tones.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.28, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
          osc.connect(gain).connect(this.masterGain);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.4);
        });
      }

      playTone(sound = 'bell') {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        if (sound === 'digital') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);
          osc.start(now); osc.stop(now + 1.8);
        }
      }

      startAmbience(type, volume = 0.5) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.nodes[type]) {
          this.setAmbienceVolume(type, volume);
          return;
        }
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(volume, this.ctx.currentTime);
        g.connect(this.masterGain);

        if (type === 'brown') {
          const sz = 2 * this.ctx.sampleRate;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          let l = 0.0;
          for (let i = 0; i < sz; i++) {
            const w = Math.random() * 2 - 1;
            d[i] = (l + 0.02 * w) / 1.02;
            l = d[i];
            d[i] *= 3.5;
          }
          const s = this.ctx.createBufferSource();
          s.buffer = b; s.loop = true;
          s.connect(g); s.start();
          this.nodes.brown = { src: s, gain: g };
        } else if (type === 'rain') {
          const sz = 2 * this.ctx.sampleRate;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
          const s = this.ctx.createBufferSource();
          s.buffer = b; s.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.7;
          s.connect(f).connect(g); s.start();
          this.nodes.rain = { src: s, gain: g };
        } else if (type === 'hum') {
          const o = this.ctx.createOscillator();
          o.type = 'sine'; o.frequency.value = 55;
          o.connect(g); o.start();
          this.nodes.hum = { src: o, gain: g };
        } else if (type === 'binaural') {
          const oscL = this.ctx.createOscillator();
          const oscR = this.ctx.createOscillator();
          oscL.type = 'sine'; oscL.frequency.value = 200;
          oscR.type = 'sine'; oscR.frequency.value = 214; // 14Hz Flow / Beta
          const merger = this.ctx.createChannelMerger(2);
          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(g);
          oscL.start(); oscR.start();
          this.nodes.binaural = { src: [oscL, oscR], gain: g };
        } else if (type === 'alpha') {
          const oscL = this.ctx.createOscillator();
          const oscR = this.ctx.createOscillator();
          oscL.type = 'sine'; oscL.frequency.value = 150;
          oscR.type = 'sine'; oscR.frequency.value = 160; // 10Hz Alpha Waves
          const merger = this.ctx.createChannelMerger(2);
          oscL.connect(merger, 0, 0);
          oscR.connect(merger, 0, 1);
          merger.connect(g);
          oscL.start(); oscR.start();
          this.nodes.alpha = { src: [oscL, oscR], gain: g };
        }
      }

      setAmbienceVolume(type, vol) {
        if (this.nodes[type] && this.ctx) {
          this.nodes[type].gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.05);
        }
      }

      stopAmbience(type) {
        if (this.nodes[type]) {
          try { 
            if (Array.isArray(this.nodes[type].src)) this.nodes[type].src.forEach(s => s.stop());
            else this.nodes[type].src.stop(); 
          } catch(e) {}
          delete this.nodes[type];
        }
      }
    }
    const soundEngine = new SoundEngine();

    // --- DESKTOP NOTIFICATIONS & SCREEN WAKE LOCK ---
    const notifier = {
      async request() {
        if ('Notification' in window && Notification.permission !== 'granted') {
          await Notification.requestPermission();
        }
      },
      dispatch(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, {
              body,
              requireInteraction: true,
              icon: 'https://cdn-icons-png.flaticon.com/512/850/850960.png'
            });
          } catch(e) {}
        }
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
      }
    };

    let wakeLockSentinel = null;
    const wakeLock = {
      async request() {
        try {
          if ('wakeLock' in navigator) wakeLockSentinel = await navigator.wakeLock.request('screen');
        } catch(e) {}
      },
      release() {
        if (wakeLockSentinel) {
          wakeLockSentinel.release().catch(()=>{});
          wakeLockSentinel = null;
        }
      }
    };

    function formatTime(secs) {
      if (isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function formatMinutesHuman(totalMinutes) {
      const m = Math.floor(Math.max(0, totalMinutes));
      const hrs = Math.floor(m / 60);
      const rem = m % 60;
      if (hrs > 0) {
        return `${hrs}h ${rem.toString().padStart(2, '0')}m`;
      }
      return `${rem}m`;
    }

    // --- DEFAULT TIME BUDGETS (ACTIVITY CAPS) ---
    const DEFAULT_TIME_BUDGETS = [
      {
        id: 'budget_tv_phone',
        title: 'Watching TV / Phone',
        category: 'entertainment',
        icon: '📺',
        maxMinutes: 180, // Requested: 3 hours max limit
        color: '#f43f5e',
        description: 'Screen leisure: Netflix, YouTube streaming, and phone scrolling.'
      },
      {
        id: 'budget_social',
        title: 'Social Feeds & Reels',
        category: 'phone',
        icon: '📱',
        maxMinutes: 60, // 1 hour max limit
        color: '#ec4899',
        description: 'Instagram, TikTok, Twitter/X, and social chats.'
      },
      {
        id: 'budget_gaming',
        title: 'Gaming & Streams',
        category: 'gaming',
        icon: '🎮',
        maxMinutes: 120, // 2 hours max limit
        color: '#8b5cf6',
        description: 'PC / Console gaming and live Twitch streams.'
      },
      {
        id: 'budget_browsing',
        title: 'Casual Browsing',
        category: 'leisure',
        icon: '🌐',
        maxMinutes: 60, // 1 hour max limit
        color: '#06b6d4',
        description: 'Aimless news, reddit, and online shopping.'
      }
    ];

    // --- HOOK: TIME BUDGETS & ACTIVITY CAP MANAGER ---
    function useBudgetManager(onLimitExceeded) {
      const [budgets, setBudgets] = useState(() => storage.get('flow_budgets_v6', DEFAULT_TIME_BUDGETS));
      useEffect(() => { storage.set('flow_budgets_v6', budgets); }, [budgets]);

      const [usageMap, setUsageMap] = useState(() => storage.get('flow_budget_usage_v6', {}));
      useEffect(() => { storage.set('flow_budget_usage_v6', usageMap); }, [usageMap]);

      const [activeBudgetId, setActiveBudgetId] = useState(null);
      const alertedTodayRef = useRef({});

      const todayKey = new Date().toDateString();

      const getUsage = useCallback((budgetId) => {
        return usageMap[todayKey]?.[budgetId] || 0;
      }, [usageMap, todayKey]);

      const logMinutes = useCallback((budgetId, deltaMins) => {
        if (!budgetId || deltaMins === 0) return;

        setUsageMap(prev => {
          const currentDayMap = prev[todayKey] || {};
          const currentVal = currentDayMap[budgetId] || 0;
          const nextVal = Math.max(0, currentVal + deltaMins);
          const newMap = {
            ...prev,
            [todayKey]: {
              ...currentDayMap,
              [budgetId]: nextVal
            }
          };

          // Check limits
          const budget = budgets.find(b => b.id === budgetId);
          if (budget) {
            const alerted = alertedTodayRef.current[budgetId] || {};
            if (nextVal >= budget.maxMinutes && !alerted['100']) {
              alerted['100'] = true;
              alertedTodayRef.current[budgetId] = alerted;
              if (onLimitExceeded) {
                onLimitExceeded({
                  budget,
                  currentMinutes: nextVal,
                  isExceeded: true,
                  percentage: Math.round((nextVal / budget.maxMinutes) * 100)
                });
              }
            } else if (nextVal >= budget.maxMinutes * 0.85 && nextVal < budget.maxMinutes && !alerted['85']) {
              alerted['85'] = true;
              alertedTodayRef.current[budgetId] = alerted;
              if (onLimitExceeded) {
                onLimitExceeded({
                  budget,
                  currentMinutes: nextVal,
                  isExceeded: false,
                  percentage: Math.round((nextVal / budget.maxMinutes) * 100)
                });
              }
            }
          }

          return newMap;
        });
      }, [budgets, todayKey, onLimitExceeded]);

      const setBudgetLimit = useCallback((budgetId, newMaxMinutes) => {
        setBudgets(prev => prev.map(b => b.id === budgetId ? { ...b, maxMinutes: Math.max(5, newMaxMinutes) } : b));
      }, []);

      const resetToday = useCallback((budgetId) => {
        setUsageMap(prev => {
          const currentDayMap = { ...(prev[todayKey] || {}) };
          delete currentDayMap[budgetId];
          return { ...prev, [todayKey]: currentDayMap };
        });
        if (alertedTodayRef.current[budgetId]) {
          delete alertedTodayRef.current[budgetId];
        }
      }, [todayKey]);

      const addBudget = useCallback((newBudget) => {
        const item = {
          id: 'budget_' + Date.now().toString(36),
          title: newBudget.title.trim(),
          category: newBudget.category || 'entertainment',
          icon: newBudget.icon || '⏱️',
          maxMinutes: Math.max(5, parseInt(newBudget.maxMinutes) || 180),
          color: newBudget.color || '#3b82f6',
          description: newBudget.description || 'Custom activity daily cap'
        };
        setBudgets(prev => [...prev, item]);
      }, []);

      const deleteBudget = useCallback((budgetId) => {
        setBudgets(prev => prev.filter(b => b.id !== budgetId));
        if (activeBudgetId === budgetId) setActiveBudgetId(null);
      }, [activeBudgetId]);

      const activeBudget = useMemo(() => budgets.find(b => b.id === activeBudgetId) || null, [budgets, activeBudgetId]);

      return {
        budgets,
        activeBudget,
        activeBudgetId,
        setActiveBudgetId,
        getUsage,
        logMinutes,
        setBudgetLimit,
        resetToday,
        addBudget,
        deleteBudget,
        usageMap,
        todayKey
      };
    }

    // --- HOOK: COMPLETE MUSIC PLAYER ---
    function useMusicPlayer(isBreak) {
      const [playlist, setPlaylist] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [repeatMode, setRepeatMode] = useState('all'); // 'off' | 'all' | 'one'
      const [isShuffle, setIsShuffle] = useState(false);
      const [duckOnBreak, setDuckOnBreak] = useState(true);

      const audioRef = useRef(new Audio());
      const currentTrack = playlist[currentIndex] || null;

      useEffect(() => {
        idb.getAllTracks().then(tracks => {
          setPlaylist(tracks.map(t => ({ ...t, url: URL.createObjectURL(t.file) })));
        });
      }, []);

      useEffect(() => {
        const a = audioRef.current;
        const onTime = () => setCurrentTime(a.currentTime);
        const onMeta = () => setDuration(a.duration || 0);
        const onEnd = () => {
          if (repeatMode === 'one') {
            a.currentTime = 0;
            a.play();
          } else if (repeatMode === 'all') {
            handleNext();
          } else {
            if (currentIndex < playlist.length - 1) handleNext();
            else setIsPlaying(false);
          }
        };
        a.addEventListener('timeupdate', onTime);
        a.addEventListener('loadedmetadata', onMeta);
        a.addEventListener('ended', onEnd);
        return () => {
          a.removeEventListener('timeupdate', onTime);
          a.removeEventListener('loadedmetadata', onMeta);
          a.removeEventListener('ended', onEnd);
        };
      }, [currentIndex, playlist.length, repeatMode]);

      useEffect(() => {
        audioRef.current.volume = isBreak && duckOnBreak ? volume * 0.25 : volume;
      }, [volume, isBreak, duckOnBreak]);

      const playIndex = (idx) => {
        if (!playlist[idx]) return;
        setCurrentIndex(idx);
        audioRef.current.src = playlist[idx].url;
        audioRef.current.play().then(() => setIsPlaying(true)).catch(()=>{});
      };

      const togglePlay = () => {
        if (!currentTrack && playlist.length > 0) return playIndex(0);
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
        else { audioRef.current.play().then(() => setIsPlaying(true)).catch(()=>{}); }
      };

      const handleNext = () => {
        if (playlist.length === 0) return;
        let nextIndex = currentIndex + 1;
        if (isShuffle) nextIndex = Math.floor(Math.random() * playlist.length);
        else if (nextIndex >= playlist.length) nextIndex = 0;
        playIndex(nextIndex);
      };

      const handlePrev = () => {
        if (playlist.length === 0) return;
        if (audioRef.current.currentTime > 3) {
          audioRef.current.currentTime = 0;
          return;
        }
        const prevIndex = currentIndex - 1 < 0 ? playlist.length - 1 : currentIndex - 1;
        playIndex(prevIndex);
      };

      const addTracks = async (files) => {
        const newTracks = [];
        for (const f of Array.from(files).filter(x => x.type.startsWith('audio/'))) {
          const item = {
            id: Date.now() + '-' + Math.random().toString(36).substring(2, 7),
            name: f.name.replace(/\.[^/.]+$/, ""),
            size: (f.size / (1024 * 1024)).toFixed(1) + ' MB',
            file: f
          };
          await idb.saveTrack(item);
          item.url = URL.createObjectURL(f);
          newTracks.push(item);
        }
        setPlaylist(p => [...p, ...newTracks]);
      };

      const removeTrack = async (id) => {
        await idb.deleteTrack(id);
        setPlaylist(p => {
          const filtered = p.filter(t => t.id !== id);
          if (currentTrack?.id === id) {
            audioRef.current.pause();
            setIsPlaying(false);
          }
          return filtered;
        });
      };

      return {
        playlist, currentTrack, isPlaying, currentTime, duration,
        volume, setVolume, repeatMode, setRepeatMode, isShuffle, setIsShuffle,
        duckOnBreak, setDuckOnBreak,
        togglePlay, handleNext, handlePrev, addTracks, removeTrack, playIndex, seek: (t) => { audioRef.current.currentTime = t; setCurrentTime(t); }
      };
    }

    // --- HOOK: TIMER SYSTEM WITH PRECISION TIMESTAMP DELTA ---
    function useTimer(onAlarmTrigger, onBudgetTick) {
      const [settings, setSettings] = useState(() => storage.get('flow_settings_v6', {
        pomodoroFocus: 25,
        pomodoroShort: 5,
        pomodoroLong: 15,
        autoStart: false,
        accentColor: '#3b82f6',
        preset: '25/5'
      }));
      useEffect(() => { storage.set('flow_settings_v6', settings); }, [settings]);

      const [stats, setStats] = useState(() => storage.get('flow_stats_v6', {
        history: {}, todayMinutes: 0, streak: 1, totalSessions: 0
      }));
      useEffect(() => { storage.set('flow_stats_v6', stats); }, [stats]);

      const [mode, setMode] = useState('pomodoro'); // 'pomodoro' | 'flowtime' | 'stopwatch' | 'cap_tracker'
      const [phase, setPhase] = useState('focus');
      const [isRunning, setIsRunning] = useState(false);
      const [time, setTime] = useState(settings.pomodoroFocus * 60);
      const [duration, setDuration] = useState(settings.pomodoroFocus * 60);
      const [sessionCount, setSessionCount] = useState(0);

      const targetRef = useRef(0);
      const countUpRef = useRef(0);
      const lastTickRef = useRef(Date.now());
      const accumulatedFocusSecsRef = useRef(0);
      const accumulatedBudgetSecsRef = useRef(0);

      const handleComplete = useCallback(() => {
        setIsRunning(false);

        let nextPh = 'shortBreak';
        let title = "Time's up!";
        let msg = "Your focus session is finished.";

        if (phase === 'focus') {
          const nextCount = sessionCount + 1;
          setSessionCount(nextCount);
          setStats(s => ({ ...s, totalSessions: (s.totalSessions || 0) + 1 }));
          const isLong = nextCount % 4 === 0;
          nextPh = isLong ? 'longBreak' : 'shortBreak';
          title = "Focus Session Finished";
          msg = isLong ? "Great progress! Time for an extended break." : "Take 5 minutes to relax and stretch.";
        } else {
          nextPh = 'focus';
          title = "Break Finished";
          msg = "Ready to engage in your next focus sprint?";
        }

        soundEngine.startAlarmLoop();
        notifier.dispatch(`⏰ ${title} - FLOW Command`, msg);

        onAlarmTrigger({
          type: 'timer',
          title,
          message: msg,
          phase,
          nextPhase: nextPh
        });
      }, [phase, sessionCount, onAlarmTrigger, setStats]);

      useEffect(() => {
        if (!isRunning) {
          wakeLock.release();
          return;
        }
        wakeLock.request();
        lastTickRef.current = Date.now();

        const interval = setInterval(() => {
          const now = Date.now();
          const deltaSecs = Math.max(0, (now - lastTickRef.current) / 1000);
          lastTickRef.current = now;

          // Cap Tracker & Stopwatch count UP
          if (mode === 'stopwatch' || mode === 'cap_tracker' || (mode === 'flowtime' && phase === 'focus')) {
            const elapsed = Math.floor((now - countUpRef.current) / 1000);
            setTime(elapsed);

            // If tracking a budget cap in real-time
            if (mode === 'cap_tracker' && onBudgetTick) {
              accumulatedBudgetSecsRef.current += deltaSecs;
              if (accumulatedBudgetSecsRef.current >= 60) {
                const wholeMinutes = Math.floor(accumulatedBudgetSecsRef.current / 60);
                accumulatedBudgetSecsRef.current -= wholeMinutes * 60;
                onBudgetTick(wholeMinutes);
              }
            }

            if (mode === 'flowtime' && phase === 'focus') {
              accumulatedFocusSecsRef.current += deltaSecs;
              if (accumulatedFocusSecsRef.current >= 60) {
                accumulatedFocusSecsRef.current -= 60;
                const today = new Date().toDateString();
                setStats(s => {
                  const todayMins = (s.history[today] || 0) + 1;
                  return {
                    ...s,
                    history: { ...s.history, [today]: todayMins },
                    todayMinutes: todayMins
                  };
                });
              }
            }
            return;
          }

          // Countdown modes (Pomodoro)
          const rem = Math.max(0, Math.ceil((targetRef.current - now) / 1000));
          setTime(rem);

          if (phase === 'focus') {
            accumulatedFocusSecsRef.current += deltaSecs;
            if (accumulatedFocusSecsRef.current >= 60) {
              accumulatedFocusSecsRef.current -= 60;
              const today = new Date().toDateString();
              setStats(s => {
                const todayMins = (s.history[today] || 0) + 1;
                return {
                  ...s,
                  history: { ...s.history, [today]: todayMins },
                  todayMinutes: todayMins
                };
              });
            }
          }

          if (rem <= 0) handleComplete();
        }, 250);

        return () => clearInterval(interval);
      }, [isRunning, mode, phase, handleComplete, setStats, onBudgetTick]);

      const toggle = () => {
        notifier.request();
        if (isRunning) {
          setIsRunning(false);
        } else {
          lastTickRef.current = Date.now();
          if (mode === 'stopwatch' || mode === 'cap_tracker' || (mode === 'flowtime' && phase === 'focus')) {
            countUpRef.current = Date.now() - (time * 1000);
          } else {
            targetRef.current = Date.now() + (time * 1000);
          }
          setIsRunning(true);
        }
      };

      const reset = () => {
        setIsRunning(false);
        if (mode === 'stopwatch' || mode === 'cap_tracker') {
          setTime(0);
          setDuration(0);
          countUpRef.current = Date.now();
        } else {
          const s = (phase === 'focus' ? settings.pomodoroFocus : phase === 'shortBreak' ? settings.pomodoroShort : settings.pomodoroLong) * 60;
          setTime(s);
          setDuration(s);
        }
      };

      const adjustTime = (deltaMins) => {
        const secs = deltaMins * 60;
        const newTime = Math.max(10, time + secs);
        setTime(newTime);
        setDuration(d => Math.max(newTime, d + secs));
        if (isRunning) targetRef.current += secs * 1000;
      };

      const startNextPhase = (nextPh) => {
        setPhase(nextPh);
        const s = (nextPh === 'focus' ? settings.pomodoroFocus : nextPh === 'shortBreak' ? settings.pomodoroShort : settings.pomodoroLong) * 60;
        setTime(s);
        setDuration(s);
        targetRef.current = Date.now() + s * 1000;
        lastTickRef.current = Date.now();
        setIsRunning(true);
      };

      const switchMode = (newMode) => {
        setIsRunning(false);
        setMode(newMode);
        if (newMode === 'stopwatch' || newMode === 'cap_tracker') {
          setTime(0);
          setDuration(0);
          countUpRef.current = Date.now();
        } else {
          setPhase('focus');
          const s = settings.pomodoroFocus * 60;
          setTime(s);
          setDuration(s);
        }
      };

      return {
        time, duration, phase, mode, sessionCount, isRunning,
        settings, setSettings, stats, setStats, toggle, reset, adjustTime,
        applyPreset: (f, r, p) => {
          setIsRunning(false);
          setSettings(s => ({ ...s, pomodoroFocus: f, pomodoroShort: r, preset: p }));
          setPhase('focus');
          setDuration(f * 60);
          setTime(f * 60);
        },
        setMode: switchMode,
        startNextPhase
      };
    }

          completed: false, 
          est: 3, 
          act: 1, 
          tag: 'tv/phone',
          type: 'budget',
          budgetId: 'budget_tv_phone',
          subtasks: [] 
        }
      ]));
      useEffect(() => { storage.set('flow_tasks_v6', tasks); }, [tasks]);

      const [activeId, setActiveId] = useState(() => storage.get('flow_active_task_id_v6', '1'));
      useEffect(() => { storage.set('flow_active_task_id_v6', activeId); }, [activeId]);

      const activeTask = useMemo(() => tasks.find(t => t.id === activeId) || null, [tasks, activeId]);

      return {
        tasks, activeTask, activeId, setActiveId,
        addTask: (title, tag = 'work', est = 2, type = 'focus', budgetId = null) => {
          if (!title.trim()) return;
          const nt = {
            id: Date.now().toString(),
            title: title.trim(),
            completed: false,
            est: Number(est) || 1,
            act: 0,
            tag,
            type,
            budgetId,
            subtasks: []
          };
          setTasks(p => [nt, ...p]);
          if (!activeId) setActiveId(nt.id);
        },
        toggleTask: (id) => setTasks(p => p.map(t => {
          if (t.id === id) {
            const next = !t.completed;
            if (next && activeId === id) setActiveId(null);
            return { ...t, completed: next };
          }
          return t;
        })),
        deleteTask: (id) => {
          setTasks(p => p.filter(t => t.id !== id));
          if (activeId === id) setActiveId(null);
        },
        incrementAct: (id) => setTasks(p => p.map(t => t.id === id ? { ...t, act: t.act + 1 } : t)),
        addSubtask: (id, text) => setTasks(p => p.map(t => t.id === id ? { ...t, subtasks: [...t.subtasks, { id: Date.now().toString(), title: text, completed: false }] } : t)),
        toggleSubtask: (tId, sId) => setTasks(p => p.map(t => t.id === tId ? { ...t, subtasks: t.subtasks.map(s => s.id === sId ? { ...s, completed: !s.completed } : s) } : t)),
        clearCompleted: () => setTasks(p => p.filter(t => !t.completed))
      };
    }

                      </button>
                      <button
                        onClick={() => budgetManager.logMinutes(b.id, 30)}
                        className="px-2.5 py-1 rounded-lg bg-white/5 hover:bg-white/10 text-[11px] font-mono text-gray-300 hover:text-white"
                      >
                        +30m
                      </button>
                      <button
                        onClick={() => budgetManager.logMinutes(b.id, 60)}
                        className="px-2.5 py-1 rounded-lg bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 text-[11px] font-mono font-bold"
                      >
                        +1 Hour
                      </button>
                      <button
                        onClick={() => budgetManager.resetToday(b.id)}
                        className="px-2 py-1 rounded-lg bg-white/5 hover:bg-rose-500/20 text-[10px] text-gray-500 hover:text-rose-400 font-mono"
                        title="Reset today's logged time"
                      >
                        Reset
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- TELEMETRY DASHBOARD (FOCUS + LEISURE BALANCE HUD) ---
    function TelemetryContent({ stats, tasks, budgetManager, accentColor }) {
      const todayStr = new Date().toDateString();
      const todayFocusMins = stats.history[todayStr] || 0;

      // Calculate total budgeted leisure time spent today
      const totalLeisureMins = useMemo(() => {
        return budgetManager.budgets.reduce((acc, b) => acc + budgetManager.getUsage(b.id), 0);
      }, [budgetManager]);

      // Focus ratio
      const totalActiveTime = todayFocusMins + totalLeisureMins;
      const focusRatio = totalActiveTime > 0 ? Math.round((todayFocusMins / totalActiveTime) * 100) : 100;

      // 12 Weeks (84 Days) Heatmap generator
      const heatmapDays = useMemo(() => {
        const list = [];
        const now = new Date();
        for (let i = 83; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          const ds = d.toDateString();
          list.push({ date: ds, mins: stats.history[ds] || 0 });
        }
        return list;
      }, [stats.history]);

      // Last 7 Days Bars
      const last7Days = useMemo(() => heatmapDays.slice(-7), [heatmapDays]);
      const maxMins = Math.max(1, ...last7Days.map(d => d.mins));

      return (
        <div className="space-y-6">
          {/* Top Metric Cards */}
          <div className="grid grid-cols-3 gap-2.5 text-center">
            <div className="p-4 bg-white/5 rounded-2xl border border-white/5">
              <span className="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Focus Work</span>
              <div className="text-2xl sm:text-3xl font-light font-mono text-white mt-1">
                {todayFocusMins} <span className="text-xs font-sans text-gray-500">min</span>
              </div>
            </div>

            <div className="p-4 bg-white/5 rounded-2xl border border-white/5">
              <span className="text-[10px] uppercase tracking-widest text-rose-400 font-bold">Leisure / Screen</span>
              <div className="text-2xl sm:text-3xl font-light font-mono text-rose-300 mt-1">
                {totalLeisureMins} <span className="text-xs font-sans text-gray-500">min</span>
              </div>
            </div>

            <div className="p-4 bg-white/5 rounded-2xl border border-white/5">
              <span className="text-[10px] uppercase tracking-widest text-emerald-400 font-bold">Focus Ratio</span>
              <div className="text-2xl sm:text-3xl font-light font-mono text-emerald-300 mt-1">
                {focusRatio}% <span className="text-xs font-sans text-gray-500">🔥</span>
              </div>
            </div>
          </div>

          {/* Daily Activity Cap Status Overview */}
          <div className="p-5 bg-white/5 rounded-2xl border border-white/5 space-y-3">
            <div className="flex justify-between items-center text-xs font-mono text-gray-300">
              <span className="uppercase tracking-wider font-bold">Today's Activity Caps Status</span>
              <span className="text-gray-500">{budgetManager.budgets.length} Monitored</span>
            </div>
            
            <div className="space-y-2.5 pt-1">
              {budgetManager.budgets.map(b => {
                const used = budgetManager.getUsage(b.id);
                const max = b.maxMinutes;
                const pct = Math.min(100, Math.round((used / max) * 100));
                const isOver = used >= max;

                return (
                  <div key={b.id} className="space-y-1">
                    <div className="flex justify-between items-center text-xs">
                      <span className="flex items-center gap-1.5 text-gray-300 font-medium">
                        <span>{b.icon}</span> {b.title}
                      </span>
                      <span className={`font-mono text-[11px] ${isOver ? 'text-rose-400 font-bold' : 'text-gray-400'}`}>
                        {formatMinutesHuman(used)} / {formatMinutesHuman(max)} {isOver && '⚠️ EXCEEDED'}
                      </span>
                    </div>
                    <div className="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                      <div
                        className="h-full rounded-full transition-all duration-300"
                        style={{
                          width: `${pct}%`,
                          backgroundColor: isOver ? '#f43f5e' : b.color || '#3b82f6'
                        }}
                      />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 12-Week Activity Heatmap */}
          <div className="p-5 bg-white/5 rounded-2xl border border-white/5 space-y-3">
            <div className="flex justify-between items-center text-xs font-mono text-gray-400">
              <span className="uppercase tracking-wider font-bold">12-Week Focus Heatmap</span>
              <span>84 Days Telemetry</span>
            </div>
            <div className="grid grid-rows-7 grid-flow-col gap-1.5 w-full overflow-x-auto py-2 scrollbar-hide">
              {heatmapDays.map((d, i) => {
                const intensity = d.mins === 0 ? 0 : Math.min(1, 0.25 + (d.mins / 120) * 0.75);
                return (
                  <div
                    key={i}
                    className="w-3.5 h-3.5 rounded-sm bg-white/5 hover:scale-125 transition-transform cursor-pointer"
                    style={intensity > 0 ? { backgroundColor: accentColor, opacity: intensity, boxShadow: `0 0 4px ${accentColor}80` } : {}}
                    title={`${d.mins} mins focused on ${d.date}`}
                  />
                );
              })}
            </div>
          </div>

          {/* Last 7 Days Vertical Chart */}
          <div className="p-5 bg-white/5 rounded-2xl border border-white/5 space-y-4">
            <div className="text-xs font-mono uppercase tracking-wider font-bold text-gray-400">
              Last 7 Days Trend
            </div>
            <div className="flex items-end justify-between h-32 w-full pt-4 border-b border-white/10 pb-2">
              {last7Days.map((d, i) => {
                const heightPct = (d.mins / maxMins) * 100;
                return (
                  <div key={i} className="flex flex-col items-center gap-2 flex-1">
                    <div className="w-4/5 rounded-t-md bg-white/5 relative overflow-hidden flex items-end" style={{ height: '100px' }}>
                      <div
                        className="w-full rounded-t-md transition-all duration-500"
                        style={{
                          height: `${Math.max(4, heightPct)}%`,
                          backgroundColor: d.mins > 0 ? accentColor : 'rgba(255,255,255,0.08)',
                          boxShadow: d.mins > 0 ? `0 0 10px ${accentColor}60` : 'none'
                        }}
                      />
                    </div>
                    <span className="text-[10px] font-mono text-gray-500">{d.date.split(' ')[0]}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // --- KEYBOARD SHORTCUTS MODAL ---
    function ShortcutsModal({ isOpen, onClose }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/75 backdrop-blur-md" onClick={onClose} />
          <div className="relative w-full max-w-md bg-[#0e0e16] border border-white/15 rounded-3xl p-6 shadow-2xl z-10 space-y-4">
            <div className="flex justify-between items-center border-b border-white/10 pb-3">
              <h4 className="text-xs font-bold uppercase tracking-widest text-gray-200 font-mono">
                Keyboard Shortcuts
              </h4>
              <button onClick={onClose} className="text-gray-400 hover:text-white">✕</button>
            </div>
            <div className="space-y-2 text-xs">
              {[
                { key: 'Space', desc: 'Start / Pause Active Timer' },
                { key: 'R', desc: 'Reset Timer' },
                { key: 'Z', desc: 'Zen Clean Mode' },
                { key: 'B', desc: 'Open Time Budgets & Caps' },
                { key: 'T', desc: 'Open Task Manager' },
                { key: 'M', desc: 'Open Offline Music Vault' },
                { key: 'L', desc: 'Open Telemetry Dashboard' },
                { key: '?', desc: 'Show this shortcuts guide' },
                { key: 'Esc', desc: 'Dismiss toasts and modal drawers' }
              ].map(s => (
                <div key={s.key} className="flex justify-between items-center py-1.5 border-b border-white/5">
                  <span className="text-gray-400">{s.desc}</span>
                  <kbd className="px-2.5 py-1 bg-white/10 border border-white/10 rounded-lg text-white font-mono font-bold text-[11px] shadow">
                    {s.key}
                  </kbd>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN APP CONTROLLER ---
    function App() {
      const [windowsToast, setWindowsToast] = useState(null);
      const [showShortcuts, setShowShortcuts] = useState(false);

      const dismissToast = useCallback(() => {
        soundEngine.stopAlarmLoop();
        setWindowsToast(null);
      }, []);

      // Budget Manager callback
      const handleLimitExceeded = useCallback(({ budget, currentMinutes, isExceeded, percentage }) => {
        soundEngine.playLimitAlertTone();
        const title = isExceeded ? `⚠️ ${budget.title} Limit Reached!` : `⏳ ${budget.title} Near Limit (${percentage}%)`;
        const message = isExceeded
          ? `You have reached your ${formatMinutesHuman(budget.maxMinutes)} max limit for ${budget.title}. Step away and switch to a focus session!`
          : `You've used ${formatMinutesHuman(currentMinutes)} of your ${formatMinutesHuman(budget.maxMinutes)} daily allowance.`;

        notifier.dispatch(title, message);

        setWindowsToast({
          type: 'budget',
          title,
          message,
          icon: budget.icon,
          budget
        });
      }, []);

      const budgetManager = useBudgetManager(handleLimitExceeded);

      // On timer tick while tracking an activity cap
      const handleBudgetTick = useCallback((minutesDelta) => {
        if (budgetManager.activeBudgetId) {
          budgetManager.logMinutes(budgetManager.activeBudgetId, minutesDelta);
        }
      }, [budgetManager]);

      const timer = useTimer(useCallback((toastPayload) => {
        setWindowsToast(toastPayload);
      }, []), handleBudgetTick);

      const taskManager = useTaskManager();
      const musicPlayer = useMusicPlayer(timer.phase.includes('Break'));

      const [drawer, setDrawer] = useState(null); // 'budgets' | 'tasks' | 'audio' | 'telemetry' | 'settings'
      const [isZen, setIsZen] = useState(false);
      const [intention, setIntention] = useState(() => storage.get('flow_daily_intention_v6', 'Ship next-gen architecture'));
      const [isEditingIntention, setIsEditingIntention] = useState(false);

      const snoozeToast = () => {
        dismissToast();
        timer.adjustTime(5);
        timer.toggle();
      };

      const startNextFromToast = (nextPhase) => {
        dismissToast();
        timer.startNextPhase(nextPhase);
      };

      const switchFromBudgetToFocus = () => {
        dismissToast();
        budgetManager.setActiveBudgetId(null);
        timer.setMode('pomodoro');
        timer.toggle();
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen().catch(()=>{});
      };

      const handleExport = () => {
        const data = {
          settings: timer.settings,
          stats: timer.stats,
          tasks: taskManager.tasks,
          budgets: budgetManager.budgets,
          budgetUsage: budgetManager.usageMap,
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `flow-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const handleImport = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.settings) storage.set('flow_settings_v6', data.settings);
            if (data.stats) storage.set('flow_stats_v6', data.stats);
            if (data.tasks) storage.set('flow_tasks_v6', data.tasks);
            if (data.budgets) storage.set('flow_budgets_v6', data.budgets);
            if (data.budgetUsage) storage.set('flow_budget_usage_v6', data.budgetUsage);
            alert('Backup successfully imported! Reloading...');
            window.location.reload();
          } catch(err) {
            alert('Invalid JSON file format.');
          }
        };
        reader.readAsText(file);
      };

      const handleTrackBudgetFromDrawer = (budget) => {
        if (budgetManager.activeBudgetId === budget.id) {
          // Deselect
          budgetManager.setActiveBudgetId(null);
          timer.setMode('pomodoro');
        } else {
          budgetManager.setActiveBudgetId(budget.id);
          timer.setMode('cap_tracker');
        }
        setDrawer(null);
      };

      // Keyboard navigation
      useEffect(() => {
        const onKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
          if (e.code === 'Space') { e.preventDefault(); timer.toggle(); }
          if (e.key.toLowerCase() === 'z') setIsZen(p => !p);
          if (e.key.toLowerCase() === 'r') timer.reset();
          if (e.key.toLowerCase() === 'b') setDrawer(d => d === 'budgets' ? null : 'budgets');
          if (e.key.toLowerCase() === 't') setDrawer(d => d === 'tasks' ? null : 'tasks');
          if (e.key.toLowerCase() === 'm') setDrawer(d => d === 'audio' ? null : 'audio');
          if (e.key.toLowerCase() === 'l') setDrawer(d => d === 'telemetry' ? null : 'telemetry');
          if (e.key === '?') setShowShortcuts(s => !s);
          if (e.key === 'Escape') {
            if (windowsToast) dismissToast();
            if (drawer) setDrawer(null);
            if (showShortcuts) setShowShortcuts(false);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [timer, windowsToast, dismissToast, drawer, showShortcuts]);

      // Timer display math
      const m = Math.floor(timer.time / 60).toString().padStart(2, '0');
      const s = (timer.time % 60).toString().padStart(2, '0');
      const progress = timer.duration > 0 ? (timer.duration - timer.time) / timer.duration : 1;
      const radius = 42;
      const c = 2 * Math.PI * radius;

      // Active Budget Stats if in Cap Tracker mode
      const activeBudget = budgetManager.activeBudget;
      const activeBudgetUsage = activeBudget ? budgetManager.getUsage(activeBudget.id) : 0;
      const isCapExceeded = activeBudget ? activeBudgetUsage >= activeBudget.maxMinutes : false;

      // Count how many activity caps have reached limit today
      const exceededCapsCount = useMemo(() => {
        return budgetManager.budgets.filter(b => budgetManager.getUsage(b.id) >= b.maxMinutes).length;
      }, [budgetManager]);

      return (
        <div className="min-h-screen flex flex-col justify-between relative overflow-hidden bg-grid-cyber pb-28 sm:pb-8">
          
          {/* WINDOWS CLOCK POP-UP NOTIFICATION TOAST */}
          <WindowsClockToast
            toast={windowsToast}
            onDismiss={dismissToast}
            onSnooze={snoozeToast}
            onStartNext={startNextFromToast}
            onSwitchFocus={switchFromBudgetToFocus}
          />

          {/* KEYBOARD SHORTCUTS MODAL */}
          <ShortcutsModal isOpen={showShortcuts} onClose={() => setShowShortcuts(false)} />

          {/* TOP HEADER */}
          <header className={`w-full max-w-5xl mx-auto px-6 py-5 flex items-center justify-between transition-opacity duration-500 z-20 ${
            isZen ? 'opacity-0 pointer-events-none' : 'opacity-100'
          }`}>
            <div className="flex items-center gap-3">
              <div 
                className="w-3 h-3 rounded-full animate-pulse-glow" 
                style={{ backgroundColor: activeBudget ? activeBudget.color : timer.settings.accentColor }} 
              />
              <span className="font-mono text-xs tracking-[0.25em] uppercase font-bold text-gray-300">
                FLOW // {activeBudget ? 'CAP GUARD' : 'COMMAND'}
              </span>
            </div>

            {/* Daily Intention */}
            <div className="hidden md:flex items-center gap-2">
              {isEditingIntention ? (
                <input
                  type="text"
                  value={intention}
                  autoFocus
                  onChange={e => setIntention(e.target.value)}
                  onBlur={() => { storage.set('flow_daily_intention_v6', intention); setIsEditingIntention(false); }}
                  onKeyDown={e => { if (e.key === 'Enter') { storage.set('flow_daily_intention_v6', intention); setIsEditingIntention(false); }}}
                  className="bg-black/60 border border-white/20 rounded-full px-4 py-1 text-xs text-white focus:outline-none"
                />
              ) : (
                <div 
                  onClick={() => setIsEditingIntention(true)}
                  className="text-xs font-mono text-gray-400 hover:text-white cursor-pointer px-4 py-1 rounded-full bg-white/5 border border-white/5 flex items-center gap-2"
                  title="Click to edit objective"
                >
                  <span>🎯 {intention}</span>
                </div>
              )}
            </div>

            {/* Top Right Controls & Modes */}
            <div className="flex items-center gap-2">
              <div className="flex bg-white/5 p-1 rounded-full border border-white/5 mr-2">
                {['pomodoro', 'flowtime', 'stopwatch', 'cap_tracker'].map(modeItem => (
                  <button
                    key={modeItem}
                    onClick={() => {
                      if (modeItem === 'cap_tracker' && !budgetManager.activeBudgetId) {
                        // Select default 3hr TV/Phone budget if none active
                        budgetManager.setActiveBudgetId('budget_tv_phone');
                      }
                      timer.setMode(modeItem);
                    }}
                    className={`px-3 py-1 rounded-full text-[10px] font-mono uppercase font-bold transition-all ${
                      timer.mode === modeItem ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
                    }`}
                  >
                    {modeItem === 'cap_tracker' ? '🛡️ Cap Guard' : modeItem}
                  </button>
                ))}
              </div>

              <button
                onClick={() => setShowShortcuts(true)}
                className="p-2 rounded-full bg-white/5 text-gray-400 hover:text-white text-xs"
                title="Keyboard Shortcuts (?)"
              >
                ⌨️
              </button>

              <button
                onClick={toggleFullscreen}
                className="p-2 rounded-full bg-white/5 text-gray-400 hover:text-white"
                title="Fullscreen"
              >
                ⛶
              </button>

              <button
                onClick={() => setIsZen(!isZen)}
                className="p-2 rounded-full bg-white/5 text-gray-400 hover:text-white"
                title="Zen Mode (Z)"
              >
                ⊙
              </button>
            </div>
          </header>

          {/* MAIN TIMER DISPLAY */}
          <main className="flex-1 flex flex-col items-center justify-center px-4 relative z-10 my-auto">
            
            {/* Active Target Banner (Task OR Time Budget) */}
            {activeBudget && timer.mode === 'cap_tracker' ? (
              <div className={`mb-4 transition-all duration-500 ${isZen ? 'opacity-40' : 'opacity-100'}`}>
                <div 
                  onClick={() => setDrawer('budgets')} 
                  className={`glass px-5 py-2.5 rounded-full flex items-center gap-3 cursor-pointer hover:border-white/30 border shadow-xl ${
                    isCapExceeded ? 'border-rose-500/50 bg-rose-950/40 animate-pulse' : 'border-white/10'
                  }`}
                >
                  <span className="text-base">{activeBudget.icon}</span>
                  <div className="flex flex-col">
                    <span className="text-xs font-bold text-gray-100">{activeBudget.title}</span>
                    <span className="text-[10px] font-mono text-gray-400">
                      Logged: <span className="text-white font-semibold">{formatMinutesHuman(activeBudgetUsage)}</span> / {formatMinutesHuman(activeBudget.maxMinutes)}
                    </span>
                  </div>
                  <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ${
                    isCapExceeded ? 'bg-rose-500 text-black' : 'bg-white/10 text-gray-300'
                  }`}>
                    {isCapExceeded ? 'MAX CAP EXCEEDED' : `${Math.round((activeBudgetUsage / activeBudget.maxMinutes) * 100)}%`}
                  </span>
                </div>
              </div>
            ) : taskManager.activeTask ? (
              <div className={`mb-4 transition-all duration-500 ${isZen ? 'opacity-30' : 'opacity-100'}`}>
                <div onClick={() => setDrawer('tasks')} className="glass px-5 py-2 rounded-full flex items-center gap-3 cursor-pointer hover:border-white/30 border border-white/10 shadow-xl">
                  <span className="w-2 h-2 rounded-full animate-ping" style={{ backgroundColor: timer.settings.accentColor }} />
                  <span className="text-xs font-semibold text-gray-200 truncate max-w-[200px] sm:max-w-xs">{taskManager.activeTask.title}</span>
                  <span className="text-xs font-mono text-gray-400">🍅 {taskManager.activeTask.act}/{taskManager.activeTask.est}</span>
                  {taskManager.activeTask.budgetId && (
                    <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded-full border border-rose-500/30">
                      Capped
                    </span>
                  )}
                </div>
              </div>
            ) : null}

            {/* Presets for Pomodoro */}
            {timer.mode === 'pomodoro' && (
              <div className={`flex items-center gap-1.5 mb-6 transition-all duration-500 ${isZen ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
                {[
                  { label: '25/5', f: 25, r: 5 },
                  { label: '50/10', f: 50, r: 10 },
                  { label: '90/20', f: 90, r: 20 }
                ].map(p => (
                  <button
                    key={p.label}
                    onClick={() => timer.applyPreset(p.f, p.r, p.label)}
                    className={`px-3 py-1 rounded-full text-xs font-mono font-medium transition-all ${
                      timer.settings.preset === p.label ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white bg-white/5'
                    }`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            )}

            {/* Interactive SVG Ring */}
            <div className="relative flex flex-col items-center justify-center select-none">
              <div className="relative flex items-center justify-center cursor-pointer" onClick={timer.toggle}>
                <div 
                  className="absolute inset-0 rounded-full blur-3xl opacity-20 transition-all duration-700 pointer-events-none"
                  style={{ 
                    backgroundColor: isCapExceeded ? '#f43f5e' : (activeBudget ? activeBudget.color : timer.settings.accentColor),
                    transform: timer.isRunning ? 'scale(1.15)' : 'scale(0.88)' 
                  }}
                />

                <svg className="w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 -rotate-90 transform" viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r={radius} className="stroke-white/5" strokeWidth="2.5" fill="transparent" />
                  <circle
                    cx="50" cy="50" r={radius}
                    stroke={isCapExceeded ? '#f43f5e' : (activeBudget ? activeBudget.color : timer.settings.accentColor)}
                    strokeWidth="3.2"
                    strokeDasharray={c}
                    strokeDashoffset={timer.mode === 'cap_tracker' && activeBudget 
                      ? c - Math.min(1, activeBudgetUsage / activeBudget.maxMinutes) * c 
                      : c - progress * c}
                    strokeLinecap="round"
                    fill="transparent"
                    style={{ transition: 'stroke-dashoffset 0.4s ease-out' }}
                  />
                </svg>

                <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                  <span className="text-[11px] uppercase tracking-[0.3em] font-mono text-gray-400 mb-1">
                    {timer.mode === 'cap_tracker' && activeBudget
                      ? `${activeBudget.title} Cap`
                      : timer.phase === 'focus' ? 'Focus Interval' : 'Rest Phase'}
                  </span>
                  
                  <div className="text-6xl sm:text-7xl md:text-8xl font-light font-mono tracking-tight text-white flex items-center justify-center">
                    <span>{m}</span>
                    <span className="opacity-40 animate-pulse">:</span>
                    <span>{s}</span>
                  </div>

                  <div className={`mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase ${
                    isCapExceeded 
                      ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40 animate-pulse'
                      : timer.isRunning 
                      ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' 
                      : 'bg-white/5 text-gray-400 border border-white/10'
                  }`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${
                      isCapExceeded ? 'bg-rose-400' : timer.isRunning ? 'bg-emerald-400 animate-ping' : 'bg-gray-400'
                    }`} />
                    {isCapExceeded ? 'CAP EXCEEDED' : timer.isRunning ? 'Active Running' : 'Paused'}
                  </div>
                </div>
              </div>

              {/* Quick Steppers */}
              {timer.mode !== 'cap_tracker' && (
                <div className="flex items-center gap-2 mt-4">
                  <button onClick={() => timer.adjustTime(-5)} className="px-2.5 py-1 text-xs font-mono font-semibold rounded-lg bg-white/5 text-gray-400 hover:text-white border border-white/5">-5m</button>
                  <button onClick={() => timer.adjustTime(1)} className="px-2.5 py-1 text-xs font-mono font-semibold rounded-lg bg-white/5 text-gray-400 hover:text-white border border-white/5">+1m</button>
                  <button onClick={() => timer.adjustTime(5)} className="px-2.5 py-1 text-xs font-mono font-semibold rounded-lg bg-white/5 text-gray-400 hover:text-white border border-white/5">+5m</button>
                </div>
              )}
            </div>

            {/* Play/Pause/Reset Controls */}
            <div className={`mt-8 flex items-center gap-4 transition-all duration-500 ${isZen ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100 scale-100'}`}>
              <button onClick={timer.reset} className="p-3.5 rounded-full bg-white/5 text-gray-400 hover:text-white active:scale-95 border border-white/5" title="Reset (R)">
                ↺
              </button>

              <button
                onClick={timer.toggle}
                className="px-8 py-4 rounded-full text-black font-bold uppercase tracking-widest text-sm flex items-center gap-3 shadow-2xl transition-all duration-200 active:scale-95"
                style={{
                  backgroundColor: timer.isRunning ? '#ffffff' : (activeBudget ? activeBudget.color : timer.settings.accentColor),
                  boxShadow: `0 0 35px ${activeBudget ? activeBudget.color : timer.settings.accentColor}40`
                }}
              >
                <span>{timer.isRunning ? 'Pause' : timer.mode === 'cap_tracker' ? 'Track Activity' : 'Start Focus'}</span>
              </button>

              <button 
                onClick={() => soundEngine.playLimitAlertTone()} 
                title="Test Activity Cap Alarm Tone" 
                className="p-3.5 rounded-full bg-white/5 text-gray-400 hover:text-white active:scale-95 border border-white/5"
              >
                🔔
              </button>
            </div>
          </main>

          {/* DOCK BAR */}
          <nav className={`fixed bottom-5 left-1/2 -translate-x-1/2 glass px-3 py-2 rounded-full flex items-center gap-2 shadow-2xl z-30 transition-all duration-500 ${
            isZen ? 'opacity-0 translate-y-10 pointer-events-none' : 'opacity-100 translate-y-0'
          }`}>
            {/* NEW: Dedicated Time Budgets Button */}
            <button
              onClick={() => setDrawer('budgets')}
              className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawer === 'budgets' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              <span>⏳ Budgets</span>
              {exceededCapsCount > 0 ? (
                <span className="w-5 h-5 rounded-full bg-rose-500 text-white font-mono text-[10px] flex items-center justify-center font-bold animate-pulse">
                  {exceededCapsCount}
                </span>
              ) : (
                <span className="text-[10px] text-gray-500 font-mono">3h cap</span>
              )}
            </button>

            <button
              onClick={() => setDrawer('tasks')}
              className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawer === 'tasks' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              Tasks
              {taskManager.tasks.filter(t => !t.completed).length > 0 && (
                <span className="w-5 h-5 rounded-full bg-blue-500 text-black font-mono text-[10px] flex items-center justify-center font-bold">
                  {taskManager.tasks.filter(t => !t.completed).length}
                </span>
              )}
            </button>

            <button
              onClick={() => setDrawer('audio')}
              className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawer === 'audio' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              Music
              {musicPlayer.isPlaying && <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />}
            </button>

            <button
              onClick={() => setDrawer('telemetry')}
              className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawer === 'telemetry' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              Telemetry
            </button>

            <button
              onClick={() => setDrawer('settings')}
              className={`flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${
                drawer === 'settings' ? 'bg-white/20 text-white' : 'text-gray-400 hover:text-white'
              }`}
            >
              Settings
            </button>
          </nav>

          {/* DRAWER PANELS */}
          {drawer && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
              <div className="absolute inset-0 bg-black/75 backdrop-blur-md" onClick={() => setDrawer(null)} />
              <div className="relative w-full sm:max-w-xl max-h-[88vh] bg-[#0c0c14] border border-white/15 sm:rounded-3xl rounded-t-3xl shadow-2xl flex flex-col overflow-hidden z-10 p-6 space-y-6">
                <div className="flex items-center justify-between border-b border-white/5 pb-3">
                  <h3 className="text-xs font-bold uppercase tracking-widest text-gray-300 font-mono">
                    {drawer === 'budgets' ? 'Time Budgets & Activity Caps' : drawer}
                  </h3>
                  <button onClick={() => setDrawer(null)} className="text-gray-400 hover:text-white">✕</button>
                </div>

                {/* BUDGETS DRAWER */}
                {drawer === 'budgets' && (
                  <BudgetsDrawerContent
                    budgetManager={budgetManager}
                    onTrackBudget={handleTrackBudgetFromDrawer}
                  />
                )}

                {/* TASKS DRAWER */}
                {drawer === 'tasks' && (
                  <div className="space-y-4">
                    <form onSubmit={(e) => {
                      e.preventDefault();
                      const form = e.target;
                      const title = form.elements.t.value;
                      const tag = form.elements.tag.value;
                      const type = form.elements.type.value;
                      const budgetId = type === 'budget' ? 'budget_tv_phone' : null;
                      taskManager.addTask(title, tag, 2, type, budgetId);
                      form.reset();
                    }} className="space-y-2">
                      <input name="t" placeholder="Add focus goal or activity..." className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" required />
                      <div className="flex gap-2">
                        <select name="type" className="flex-1 bg-black/40 border border-white/10 rounded-lg p-2 text-xs text-white">
                          <option value="focus">Focus Task (Pomodoro)</option>
                          <option value="budget">Capped Activity (TV/Phone Limit)</option>
                        </select>
                        <select name="tag" className="flex-1 bg-black/40 border border-white/10 rounded-lg p-2 text-xs text-white">
                          <option value="work">Tag: Work</option>
                          <option value="code">Tag: Code</option>
                          <option value="study">Tag: Study</option>
                          <option value="tv/phone">Tag: TV / Phone</option>
                          <option value="leisure">Tag: Leisure</option>
                        </select>
                        <button type="submit" className="px-4 py-2 bg-blue-500 text-black font-bold text-xs rounded-lg">+ Add</button>
                      </div>
                    </form>
                    
                    <div className="flex justify-between text-xs text-gray-500 border-b border-white/5 pb-2">
                      <span>Tasks List ({taskManager.tasks.length})</span>
                      <button onClick={taskManager.clearCompleted} className="hover:text-red-400 uppercase font-semibold">Clear Completed</button>
                    </div>

                    <div className="space-y-2.5 max-h-72 overflow-y-auto pr-1 custom-scroll">
                      {taskManager.tasks.map(t => (
                        <div key={t.id} className="p-3 bg-white/5 rounded-xl border border-white/5 space-y-2">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                              <input type="checkbox" checked={t.completed} onChange={() => taskManager.toggleTask(t.id)} className="rounded" />
                              <span className={t.completed ? 'line-through text-gray-500 text-sm' : 'text-white text-sm'}>{t.title}</span>
                              {t.budgetId && (
                                <span className="text-[10px] bg-rose-500/20 text-rose-300 px-1.5 py-0.5 rounded border border-rose-500/30">
                                  3h Cap
                                </span>
                              )}
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => taskManager.incrementAct(t.id)} className="text-xs font-mono text-gray-400 hover:text-white">🍅 {t.act}/{t.est}</button>
                              <button onClick={() => taskManager.setActiveId(t.id)} className="text-xs text-blue-400 px-2 py-0.5 bg-blue-500/10 rounded">Target</button>
                              <button onClick={() => taskManager.deleteTask(t.id)} className="text-xs text-gray-500 hover:text-red-400">✕</button>
                            </div>
                          </div>

                          {/* Subtasks */}
                          <div className="pl-6 space-y-1 text-xs">
                            {t.subtasks && t.subtasks.map(s => (
                              <div key={s.id} className="flex items-center gap-2">
                                <input type="checkbox" checked={s.completed} onChange={() => taskManager.toggleSubtask(t.id, s.id)} className="w-3 h-3" />
                                <span className={s.completed ? 'line-through text-gray-500' : 'text-gray-300'}>{s.title}</span>
                              </div>
                            ))}
                            <button 
                              onClick={() => {
                                const text = prompt("Subtask title:");
                                if (text) taskManager.addSubtask(t.id, text);
                              }}
                              className="text-[10px] text-gray-500 hover:text-gray-300 uppercase tracking-wide block pt-1"
                            >
                              + Add Subtask
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* AUDIO DRAWER */}
                {drawer === 'audio' && (
                  <div className="space-y-4">
                    <div className="p-4 bg-white/5 rounded-xl space-y-3">
                      <div className="text-xs font-semibold text-gray-300">Custom Offline Music Vault</div>
                      <input type="file" multiple accept="audio/*" onChange={e => musicPlayer.addTracks(e.target.files)} className="text-xs text-gray-400" />
                      
                      {/* Scrubber */}
                      <div className="space-y-1 pt-2">
                        <input type="range" min="0" max={musicPlayer.duration || 100} value={musicPlayer.currentTime} onChange={e => musicPlayer.seek(parseFloat(e.target.value))} className="w-full" />
                        <div className="flex justify-between text-[10px] font-mono text-gray-400">
                          <span>{formatTime(musicPlayer.currentTime)}</span>
                          <span>{formatTime(musicPlayer.duration)}</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between pt-1">
                        <div className="flex items-center gap-2">
                          <button onClick={() => musicPlayer.setIsShuffle(!musicPlayer.isShuffle)} className={`text-xs ${musicPlayer.isShuffle ? 'text-blue-400' : 'text-gray-500'}`}>🔀</button>
                          <button onClick={() => musicPlayer.setRepeatMode(m => m === 'all' ? 'one' : m === 'one' ? 'off' : 'all')} className="text-xs text-gray-400">
                            {musicPlayer.repeatMode === 'one' ? '🔂' : '🔁'}
                          </button>
                          <button onClick={musicPlayer.handlePrev} className="text-gray-400 hover:text-white text-xs">⏮</button>
                          <button onClick={musicPlayer.togglePlay} className="px-3 py-1 bg-white text-black rounded text-xs font-bold">
                            {musicPlayer.isPlaying ? 'Pause' : 'Play'}
                          </button>
                          <button onClick={musicPlayer.handleNext} className="text-gray-400 hover:text-white text-xs">⏭</button>
                        </div>
                        <span className="text-xs text-gray-400 truncate max-w-[140px]">{musicPlayer.currentTrack?.name || 'No file'}</span>
                      </div>
                    </div>

                    {/* Ambient Synthesizers */}
                    <div className="p-4 bg-white/5 rounded-xl space-y-3">
                      <div className="text-xs font-semibold text-gray-300">Ambient Background Synthesizer</div>
                      
                      <div className="flex justify-between text-xs items-center">
                        <span>Brown Noise</span>
                        <input type="range" min="0" max="1" step="0.05" onChange={e => {
                          const v = parseFloat(e.target.value);
                          if (v === 0) soundEngine.stopAmbience('brown');
                          else soundEngine.startAmbience('brown', v);
                        }} />
                      </div>

                      <div className="flex justify-between text-xs items-center">
                        <span>Rainfall</span>
                        <input type="range" min="0" max="1" step="0.05" onChange={e => {
                          const v = parseFloat(e.target.value);
                          if (v === 0) soundEngine.stopAmbience('rain');
                          else soundEngine.startAmbience('rain', v);
                        }} />
                      </div>

                      <div className="flex justify-between text-xs items-center">
                        <span>55Hz Deep Focus Hum</span>
                        <input type="range" min="0" max="1" step="0.05" onChange={e => {
                          const v = parseFloat(e.target.value);
                          if (v === 0) soundEngine.stopAmbience('hum');
                          else soundEngine.startAmbience('hum', v);
                        }} />
                      </div>

                      <div className="flex justify-between text-xs items-center">
                        <span>14Hz Flow Binaural</span>
                        <input type="range" min="0" max="1" step="0.05" onChange={e => {
                          const v = parseFloat(e.target.value);
                          if (v === 0) soundEngine.stopAmbience('binaural');
                          else soundEngine.startAmbience('binaural', v);
                        }} />
                      </div>

                      <div className="flex justify-between text-xs items-center">
                        <span>10Hz Alpha Calm Wave</span>
                        <input type="range" min="0" max="1" step="0.05" onChange={e => {
                          const v = parseFloat(e.target.value);
                          if (v === 0) soundEngine.stopAmbience('alpha');
                          else soundEngine.startAmbience('alpha', v);
                        }} />
                      </div>
                    </div>
                  </div>
                )}

                {/* TELEMETRY DRAWER */}
                {drawer === 'telemetry' && (
                  <TelemetryContent 
                    stats={timer.stats} 
                    tasks={taskManager.tasks} 
                    budgetManager={budgetManager} 
                    accentColor={timer.settings.accentColor} 
                  />
                )}

                {/* SETTINGS DRAWER */}
                {drawer === 'settings' && (
                  <div className="space-y-4 text-xs">
                    <div className="flex justify-between items-center">
                      <span>Focus Duration (mins)</span>
                      <input type="number" value={timer.settings.pomodoroFocus} onChange={e => timer.setSettings(s => ({ ...s, pomodoroFocus: parseInt(e.target.value)||25 }))} className="w-16 bg-black/40 border border-white/10 rounded p-1 text-center font-mono" />
                    </div>
                    <div className="flex justify-between items-center">
                      <span>Break Duration (mins)</span>
                      <input type="number" value={timer.settings.pomodoroShort} onChange={e => timer.setSettings(s => ({ ...s, pomodoroShort: parseInt(e.target.value)||5 }))} className="w-16 bg-black/40 border border-white/10 rounded p-1 text-center font-mono" />
                    </div>
                    <div className="flex justify-between items-center">
                      <span>Accent Core Color</span>
                      <div className="flex gap-2">
                        {['#3b82f6', '#10b981', '#8b5cf6', '#f43f5e', '#f59e0b', '#06b6d4'].map(c => (
                          <button key={c} onClick={() => timer.setSettings(s => ({ ...s, accentColor: c }))} className="w-5 h-5 rounded-full" style={{ backgroundColor: c }} />
                        ))}
                      </div>
                    </div>

                    <button onClick={() => notifier.request()} className="w-full py-2.5 rounded-xl bg-white/10 font-bold uppercase hover:bg-white/15 transition-all">
                      Grant Desktop Notifications
                    </button>

                    {/* Data Backup & Restore */}
                    <div className="pt-3 border-t border-white/5 flex gap-2">
                      <button onClick={handleExport} className="flex-1 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-center font-bold uppercase">
                        Export Backup
                      </button>
                      <label className="flex-1 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-center font-bold uppercase cursor-pointer">
                        Import Backup
                        <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                      </label>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
